<script>
'use strict';
const APP_RELEASE='58', APP_RELEASE_DATE='11/11/2026';
const VERSION=3, GOOGLE_OAUTH_CLIENT_ID='708665310867-i4kvrt02fpmqhac0pfipnhi7f899a625.apps.googleusercontent.com', DBNAME='AgroStockLocal_v1', STORE='database';
const U=['kg','g','L','cm³','ud.'];
let model={version:VERSION,tech:'Técnico 1',customers:[],products:[],movements:[],documents:[],plans:[],visits:[],orders:[],alerts:[],clientStatuses:[],productStatuses:[],productSelections:[],customerDirectory:[],productMappings:[],updated:''};
let screen='inicio',selected='',customerTab='stock',filter='',db=null, pendingAction=null, voiceOn=false;
// Autorización Google Drive de prueba: token exclusivamente en memoria, nunca en IndexedDB o exportaciones.
let driveTokenClient=null, driveAccessToken=null, driveTokenExpires=0, driveStatus='No conectado';
const DRIVE_PREF_KEY='agrostock-drive-preferred-v1';
let drivePreferred=false;
try{drivePreferred=localStorage.getItem(DRIVE_PREF_KEY)==='1'}catch(e){}
const DRIVE_LOGIN_HINT_KEY='agrostock-drive-account-email-v1';
let driveLoginHint='';
try{driveLoginHint=localStorage.getItem(DRIVE_LOGIN_HINT_KEY)||''}catch(e){}
function saveDriveLoginHint(){
const value=String($('driveAccountEmail')?.value||'').trim().toLowerCase();
if(value&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))return t('Introduce una dirección de Google válida.','error');
driveLoginHint=value;
try{if(value)localStorage.setItem(DRIVE_LOGIN_HINT_KEY,value);else localStorage.removeItem(DRIVE_LOGIN_HINT_KEY)}catch(e){}
t('Cuenta preferida guardada para este dispositivo.');render();
}
function driveIsConnected(){return !!driveAccessToken&&Date.now()<driveTokenExpires-60000&&driveStatus.startsWith('Conexión comprobada')}
function driveStatusHTML(){
const connected=driveIsConnected();
const expired=!!driveAccessToken&&Date.now()>=driveTokenExpires-60000;
const state=connected?'🟢 Conectado a Google Drive':expired?'🟠 Sesión caducada; vuelve a conectar':drivePreferred?'🟡 Cuenta recordada; necesita autorización':'⚪ Sin conectar';
return `<div class="half card"><h2>☁️ Google Drive — conexión y sincronización</h2><p class="muted">Acceso limitado a la carpeta propia de AgroStock (drive.appdata).</p><div class="notice"><strong>Estado:</strong> ${esc(state)}<br>${esc(driveStatus)}<br><strong>Sincronización:</strong> ${autoSyncEnabled?'automática activada mientras Drive permanezca autorizado.':'manual (puedes activar la automática abajo).'}<br><strong>${esc(syncUiStatus())}</strong></div><div class="actions">${connected?'<button class="btn alt" id="driveDisconnect">Desconectar Google Drive</button>':'<button class="btn" id="driveConnect">Conectar Google Drive</button>'}</div><p class="small muted">${drivePreferred?'Se recuerda que quieres conectar esta cuenta en este dispositivo.':'La autorización puede recordarse como preferencia en este dispositivo.'} Los tokens de acceso se mantienen solo mientras esta sesión esté activa y caducan; por seguridad, en esta versión puede ser necesario pulsar «Conectar» después de cerrar la app. No se guardan contraseñas ni tokens en la base local.</p><div class="field"><label for="driveAccountEmail">Cuenta Google preferida (para evitar el selector)</label><input id="driveAccountEmail" type="email" placeholder="cuenta@gmail.com" value="${esc(driveLoginHint)}"></div><button type="button" class="btn alt" id="saveDriveAccount">Guardar cuenta preferida</button><p class="small muted">Solo se guarda el correo en este dispositivo. Google puede pedir autorización igualmente. Este ajuste no impide elegir otra cuenta si la configuración de Google lo permite.</p></div>`}
function loadGoogleIdentity(){return new Promise((res,rej)=>{if(window.google?.accounts?.oauth2)return res();if(document.getElementById('google-identity-script')){return rej(Error('Google Identity Services aún se está cargando; inténtalo de nuevo'))}let sc=document.createElement('script');sc.id='google-identity-script';sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=res;sc.onerror=()=>rej(Error('No se pudo cargar Google Identity Services. Comprueba la conexión'));document.head.append(sc)})}
async function driveConnect(){if(!navigator.onLine)return t('Para conectar Google Drive necesitas internet','error');driveStatus='Preparando autorización…';render();try{if(!window.google?.accounts?.oauth2)throw Error('El servicio de Google aún no está cargado; espera unos segundos y vuelve a pulsar');driveTokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_OAUTH_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.appdata',...(driveLoginHint?{login_hint:driveLoginHint}:{}),callback:async r=>{if(r.error){driveStatus='Error de autorización: '+r.error;render();return}driveAccessToken=r.access_token;driveTokenExpires=Date.now()+(Number(r.expires_in)||3600)*1000;driveStatus='Autorizado; comprobando acceso a appDataFolder…';render();try{let response=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=nextPageToken,files(id,name)&page_size=10',{headers:{Authorization:'Bearer '+driveAccessToken}});if(!response.ok)throw Error('Drive API HTTP '+response.status);let data=await response.json();driveStatus='Conexión comprobada. Archivos propios visibles: '+(data.files?.length||0)+'.';if(autoSyncEnabled)syncAutoSchedule(1200);drivePreferred=true;try{localStorage.setItem(DRIVE_PREF_KEY,'1')}catch(e){}}catch(e){driveStatus='Autorización concedida, pero fallo de API: '+e.message}render()}});driveTokenClient.requestAccessToken({prompt:'',...(driveLoginHint?{login_hint:driveLoginHint}:{})})}catch(e){driveStatus='No conectado: '+e.message;render()}}

const SYNC_NAME='agrostock-sync-v1.json',SYNC_KEYS=['customers','products','movements','documents','plans','visits','orders','alerts','clientStatuses','productStatuses','productSelections','customerDirectory','productMappings'];
let syncBusy=false,syncMessage='Todavía no se ha sincronizado en esta sesión.',autoSyncTimer=null,autoSyncPending=false,autoSyncLastSuccess='';
const SYNC_DIRTY_KEY='agrostock-pending-upload-v1';
let syncDirty=false;
try{syncDirty=localStorage.getItem(SYNC_DIRTY_KEY)==='1'}catch(e){}
function markSyncDirty(v){syncDirty=!!v;try{localStorage.setItem(SYNC_DIRTY_KEY,syncDirty?'1':'0')}catch(e){}}
function syncUiStatus(){
if(syncDirty)return '🟠 '+(model.pendingChanges?.length||1)+' operación(es) local(es) pendientes de comprobar con Google Drive.';
if(!driveIsConnected())return '🟡 Drive sin autorización activa; los datos locales están conservados.';
return autoSyncLastSuccess?'🟢 Última comprobación con Drive: '+autoSyncLastSuccess:'🔵 Conectado; pendiente de la primera comprobación.';
}

let autoSyncPoll=null;
function autoSyncHeartbeat(){if(!autoSyncEnabled||document.hidden||!navigator.onLine||!driveIsConnected()||syncBusy)return;syncAutoSchedule(1200);}
autoSyncPoll=setInterval(autoSyncHeartbeat,60000);
const AUTO_SYNC_KEY='agrostock-auto-sync-v1';
let autoSyncEnabled=false;
try{autoSyncEnabled=localStorage.getItem(AUTO_SYNC_KEY)==='1'}catch(e){}
function syncAutoSchedule(delay=2800){
if(!autoSyncEnabled||!navigator.onLine)return;
if(!driveIsConnected()){if(drivePreferred)driveStatus='Se necesita conectar Google Drive para enviar cambios pendientes';return;}
autoSyncPending=true;
clearTimeout(autoSyncTimer);
autoSyncTimer=setTimeout(async()=>{
if(!autoSyncEnabled||!driveIsConnected()||!navigator.onLine){autoSyncPending=false;return;}
if(syncBusy){syncAutoSchedule(4500);return;}
// Sincronizar aunque el foco permanezca en un campo después de guardar.
autoSyncPending=false;await syncNow(true);
},delay);
}
function syncAutoToggle(checked){
autoSyncEnabled=checked;
try{localStorage.setItem(AUTO_SYNC_KEY,checked?'1':'0')}catch(e){}
if(checked)syncAutoSchedule(800);else{clearTimeout(autoSyncTimer);autoSyncPending=false;}
render();
}
function syncPanel(){return '<div class="full card"><h2>🔄 Sincronización con Google Drive</h2><p>Une los registros de móvil y tablet sin duplicar identificadores. Comienza por el móvil, después sincroniza la tablet.</p><div class="notice"><b>'+esc(syncUiStatus())+'</b><br>'+esc(syncMessage)+(autoSyncLastSuccess?'<br><b>Última sincronización de esta sesión:</b> '+esc(autoSyncLastSuccess):'')+'</div><div class="actions"><button class="btn" id="syncNow" '+(!driveIsConnected()||syncBusy?'disabled':'')+'>'+(syncBusy?'Sincronizando…':'🔄 Sincronizar ahora')+'</button><button class="btn alt" id="syncBackup">⬇ Copia de seguridad</button></div><label class="field" style="display:flex;align-items:center;gap:10px;margin:12px 0"><input type="checkbox" id="autoSyncToggle" '+(autoSyncEnabled?'checked':'')+'><span><b>Sincronización automática (pruebas)</b><br><small>Tras conectar Drive, al guardar cambios y al recuperar la conexión.</small></span></label><p class="small muted">Requiere internet y conexión autorizada. Experimental: mantén la misma cuenta en ambos dispositivos. No edites el mismo registro simultáneamente. Si hay versiones diferentes de un registro, se detiene sin sobrescribirlo. No desinstales la aplicación sin hacer una copia.</p></div>'}

function emptyTestDataset(){const next={...model,version:VERSION,syncEpoch:Math.max(Date.now(),Number(model.syncEpoch)||0)+1,updated:stamp()};for(const key of SYNC_KEYS)next[key]=[];return next;}


async function resetProductTrials(){
 if(syncBusy)return t('Hay una sincronización en curso. Prueba cuando termine.','error');
 if(!driveIsConnected()||!navigator.onLine)return t('Conecta Google Drive antes de reiniciar el catálogo en todos los dispositivos.','error');
 if(!confirm('REINICIAR SOLO PRODUCTOS DE PRUEBA\n\nSE CONSERVAN:\n- Directorio Carballa de clientes\n- Agricultores incorporados y sus datos\n- Visitas, pedidos, documentos y alertas\n\nSE BORRAN:\n- Catálogo de productos anterior, activaciones y clasificaciones\n- Compras, aplicaciones y revisiones de stock\n- Planes de abonado que contienen productos de prueba\n\nSe hará copia local y copia de Drive antes de modificar nada. ¿Continuar?'))return;
 if(prompt('Para confirmar escribe exactamente: REINICIAR PRODUCTOS')!=='REINICIAR PRODUCTOS')return t('Reinicio cancelado.');
 clearTimeout(autoSyncTimer);autoSyncPending=false;syncBusy=true;syncMessage='Reiniciando catálogo y movimientos de prueba…';render();
 try{
  const files=await driveFiles();if(files.length>1)throw Error('Hay varias copias principales en Drive. No se ha modificado nada.');
  const remote=files.length?await driveGet(files[0].id):null;
  if(remote&&(Number(remote.syncEpoch)||0)!==(Number(model.syncEpoch)||0))throw Error('La generación de Drive es distinta. Sincroniza antes de iniciar el reinicio.');
  const combined=remote?mergeCloud(model,remote):{...model};
  backup();
  if(remote)await drivePut('agrostock-respaldo-antes-de-reiniciar-productos-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',remote);
  const next={...combined,syncEpoch:Math.max(Date.now(),Number(combined.syncEpoch)||0)+1,updated:stamp(),pendingChanges:[],products:[],movements:[],plans:[],productStatuses:[],productSelections:[],productMappings:[]};
  const latest=await driveFiles();
  if(latest.length!==files.length||(latest.length&&String(latest[0].version)!==String(files[0].version)))throw Error('La copia de Drive ha cambiado. Reinicio cancelado.');
  await drivePut(SYNC_NAME,next,files[0]?.id);
  model=next;productEditId='';pendingAction=null;await dbPut();markSyncDirty(false);syncMessage='Catálogo anterior y movimientos de prueba reiniciados. Clientes conservados. Ya puedes importar el catálogo maestro nuevo.';t('Productos reiniciados. Clientes conservados.');
 }catch(e){syncMessage='No se pudo reiniciar: '+e.message;t(syncMessage,'error');console.error(e)}
 finally{syncBusy=false;render()}
}


function isIsonetLTTProduct(p){
 if(!p)return false;
 const raw=norm(String(p.name||'')),family=norm(String(stockDisplayName(p)||''));
 return /^isonet ltt(?:\s*\(\s*\d+\s*\))?$/.test(raw)||family==='isonet ltt';
}
async function clearTestMovements(){
if(syncBusy)return t('Hay una sincronización en curso. Repite la operación cuando termine.','error');
if(!driveIsConnected()||!navigator.onLine)return t('Conecta Google Drive para eliminar movimientos de prueba en móvil y tablet sin que reaparezcan.','error');
if(!confirm('¿Eliminar TODOS los movimientos de prueba (compras, aplicaciones, revisiones y otras salidas)?\n\nSe conservarán los clientes activos, directorio de clientes, catálogo de productos, incorporaciones, planes y demás información.\n\nSe descargará una copia de seguridad antes del borrado.'))return;
if(prompt('Para confirmar escribe exactamente: BORRAR MOVIMIENTOS')!=='BORRAR MOVIMIENTOS')return t('Borrado cancelado.');
clearTimeout(autoSyncTimer);autoSyncPending=false;syncBusy=true;syncMessage='Preparando limpieza de movimientos de prueba…';render();
try{
const files=await driveFiles();if(files.length>1)throw Error('Hay varias copias principales en Drive. No se ha borrado nada.');
const remote=files.length?await driveGet(files[0].id):null;
if(remote&&(Number(remote.syncEpoch)||0)!==(Number(model.syncEpoch)||0))throw Error('La generación de datos de Drive es diferente. Sincroniza manualmente antes de borrar.');
const combined=remote?mergeCloud(model,remote):{...model};
backup();

function prod(id){return model.products.find(x=>x.id===id)}
function pName(id){return prod(id)?.name||'Producto no encontrado'}

function baseUnit(unit){return unit==='kg'||unit==='g'?'g':unit==='L'||unit==='cm³'?'cm³':'ud.'}
function toBase(amount,unit){return num(amount)*(unit==='kg'||unit==='L'?1000:1)}
function fromBase(amount,unit){return amount/(unit==='kg'||unit==='L'?1000:1)}
function movementStockDelta(m,p){
if(seedStock(p)&&m.kind==='entrada'&&Number.isFinite(Number(m.packCount))&&Number(m.packSize)>1&&m.qtyUnit!=='ud.')return Number(m.packCount);
if(seedStock(p)&&m.kind==='entrada'&&Number.isFinite(Number(m.packCount))&&Number(m.packSize)>1&&m.qtyUnit==='ud.')return Number(m.packCount);
return Number(m.delta)||0;
}
function stockBase(cid,pid){const p=prod(pid);if(!p)return 0;const key=stockGroupKey(p);return model.movements.filter(x=>x.customerId===cid&&stockGroupKey(prod(x.productId))===key).reduce((sum,x)=>sum+movementStockDelta(x,prod(x.productId)),0)}
function seedStock(p){
if(!p)return false;
if(p.category==='semillas'||p.stockMode==='envases')return true;
// Las familias 51-54 del catálogo Carballa son semillas y material de siembra:
// el formato (gramos, número de semillas o bolsita) nunca determina la unidad de stock.
if(p.origin==='catalogo_carballa'&&/^5[1-4]\d{4}$/.test(String(p.code||'')))return true;
const name=norm(String(p.name||''));
if(p.origin==='catalogo_carballa'&&/^55\d{4}$/.test(String(p.code||''))&&/\bcesped\b/.test(name))return true;
if(p.stockMode==='contenido')return false;
return /\b(semilla|semillas|simiente|simientes|semillas? de|sementes|sementes de)\b/.test(name);
}
function itemStock(p){
if(!p)return false;
if(p.stockMode==='contenido'||p.category==='difusor')return false;
if(p.stockMode==='unidades'||p.category==='material')return true;
const name=norm(String(p.name||''));
return /\b(traje|trajes|mono|monos|buzo|buzos|overol|overoles|base engomada|bases engomadas|base adhesiva|bases adhesivas|guante|guantes|mascarilla|mascarillas|gafas de proteccion)\b/.test(name);
}
function discreteStock(p){return seedStock(p)||itemStock(p);}
function stockUnit(p){return seedStock(p)?'envases':itemStock(p)?'ud.':p?.unit||'ud.';}
function fromStockBase(value,p){return discreteStock(p)?value:fromBase(value,p.unit);}
function productMapping(p){if(!p)return null;return (model.productMappings||[]).filter(x=>x.productId===p.id).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||''))||String(b.id).localeCompare(String(a.id)))[0]||null}
function catalogFormat(p){if(!p)return '';const map=productMapping(p);if(map?.format)return map.format;const pack=commercialPack(p);return String(p.commercialFormat||'').trim()||pack?.source||String(p.package||'').trim()||'Sin formato identificado'}
function isLobelabMonitoring(p){return !!p&&['310003','310005'].includes(String(p.code||''))&&/LOBELAB/i.test(p.name||'')}
function legalStatus(p){if(!p)return 'Sin información';if(isLobelabMonitoring(p))return 'Feromona de monitoreo · NO fitosanitario (confirmado por usuario)';const m=productMapping(p);const reg=String(m?.registration??p.registration??'').trim();if(reg&&m?.verified)return 'Registro MAPA verificado: '+reg;if(reg)return 'Nº MAPA '+reg+' (pendiente verificar)';if(m?.confirmedNoRegistration)return 'Sin registro fitosanitario (comprobado)';if(p.regulatoryClassification==='feromona_monitoreo_no_fitosanitario')return 'Feromona de monitoreo · NO fitosanitario (declaración usuario)';return 'Sin nº MAPA informado (pendiente verificar)'}
function catalogFamilyGroups(){const map=new Map();for(const p of model.products){let k=stockGroupKey(p);if(!map.has(k))map.set(k,{name:stockDisplayName(p),unit:stockUnit(p),products:[]});map.get(k).products.push(p)}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
async function saveProductMapping(e){e.preventDefault();let f=new FormData(e.target),p=prod(f.get('productId')),name=String(f.get('familyName')||'').trim(),format=String(f.get('format')||'').trim(),registration=String(f.get('registration')||'').trim(),verified=f.get('verified')==='on',confirmedNoRegistration=f.get('confirmedNoRegistration')==='on';if(!p||!name||name.length>150||format.length>90)return t('Revisa nombre principal y formato','error');if(verified&&!registration)return t('Para marcar registrado hace falta un número MAPA','error');if(confirmedNoRegistration&&registration)return t('No se puede indicar registro y ausencia de registro a la vez','error');model.productMappings.push({id:id(),productId:p.id,familyName:name,format,registration,verified,confirmedNoRegistration,at:stamp(),technician:model.tech});await save();productEditId='';render();t('Ficha comercial guardada')}
function productEditor(){const p=prod(productEditId);if(!p)return '';const m=productMapping(p)||{};return `<div class="card" style="margin-top:12px"><h3>Editar producto y presentación</h3><p class="muted small">Código: ${esc(p.code||'Manual')} · Original: ${esc(p.name)}</p><form id="editProductMapping" class="stack"><input type="hidden" name="productId" value="${esc(p.id)}">${input('Producto principal (sin formato) *','familyName','text',m.familyName||stockDisplayName(p),'required maxlength="150"')}${input('Presentación comercial','format','text',m.format||catalogFormat(p),'maxlength="90"')}${input('Número de registro MAPA (si consta)','registration','text',m.registration??p.registration??'','maxlength="40"')}<label><input type="checkbox" name="verified" ${m.verified?'checked':''}> Registro comprobado en fuente oficial MAPA</label><label><input type="checkbox" name="confirmedNoRegistration" ${m.confirmedNoRegistration?'checked':''}> Comprobado que no tiene registro fitosanitario</label><div class="actions"><button class="btn" type="submit">Guardar ficha</button><button class="btn alt" type="button" id="cancelProductEdit">Cancelar</button></div></form><div class="notice">La clasificación legal y la unidad de inventario son independientes. Los registros no verificados quedan marcados como pendientes.</div></div>`}
function stockProductName(p){
 if(!p)return '';
 const map=productMapping(p);if(map?.familyName)return map.familyName;if(/^ISONET\s+(?:LTT|PF|T)\s*\(\s*\d+\s*\)\s*$/i.test(String(p.name||'').trim()))return String(p.name).trim().replace(/\s*\(\s*\d+\s*\)\s*$/,'');if(p.familyName)return p.familyName;if(isLobelabMonitoring(p))return 'LOBELAB';
 if(discreteStock(p))return p.name;
 let name=String(p.name||'').trim();
 name=name.replace(/\s*(?:\/|[-,])\s*\d+(?:[.,]\d+)?\s*(?:kg|kgs?|g|grs?\.?|gramos?|l|lts?\.?|litros?|ml|cm3|cm³|cc|uds?\.?|unidades?)\s*$/i,'');
 name=name.replace(/\s+\d+(?:[.,]\d+)?\s*(?:kg|kgs?|g|grs?\.?|gramos?|l|lts?\.?|litros?|ml|cm3|cm³|cc)\s*$/i,'');
 return name.trim()||p.name;
}
function stockDisplayName(p){
if(isLobelabMonitoring(p))return 'LOBELAB';
const name=stockProductName(p);
if(p&&!discreteStock(p)&&/^profiler(?:\s+wg)?$/i.test(name.trim()))return 'PROFILER';
return name;
}
function stockGroupKey(p){
 if(!p)return '';
 return discreteStock(p)?'individual:'+p.id:'contenido:'+norm(stockDisplayName(p))+'|'+baseUnit(p.unit);
}
function groupProductsFor(cid){
 const grouped=new Map();
 for(const m of model.movements){if(m.customerId!==cid)continue;const p=prod(m.productId);if(!p)continue;const key=stockGroupKey(p);if(!grouped.has(key))grouped.set(key,p);}
 return [...grouped.values()].sort((a,b)=>stockProductName(a).localeCompare(stockProductName(b)));
}

 if(purchase)return '<option value="">Selecciona una presentación comercial</option>'+items.map(p=>`<option value="${esc(p.id)}" ${p.id===selectedId?'selected':''}>${esc(p.name)} (${esc(stockUnit(p))})${p.code?' · Ref. '+esc(p.code):''}</option>`).join('');

 return '<option value="">Selecciona un producto (sin presentación)</option>'+[...grouped.values()].sort((a,b)=>stockProductName(a).localeCompare(stockProductName(b))).map(p=>`<option value="${esc(p.id)}" ${p.id===chosen?'selected':''}>${esc(stockDisplayName(p))} (${esc(stockUnit(p))})</option>`).join('');
}

function signed(m){let p=prod(m.productId);if(!p)return '';let value=fromStockBase(movementStockDelta(m,p),p);return (value>0?'+':'')+fmt(value)+' '+stockUnit(p)}

// Los selectores mantienen su valor real, aunque el usuario filtre la lista;

function installQuickSearch(){
if(!document.getElementById('ag-combobox-style')){
const style=document.createElement('style');style.id='ag-combobox-style';
style.textContent='.ag-combo{position:relative;width:100%}.ag-combo-input{width:100%;box-sizing:border-box;padding-right:68px!important}.ag-combo-clear{position:absolute;right:34px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#46554a;font:inherit;font-size:22px;line-height:1;padding:4px 6px;cursor:pointer;z-index:2}.ag-combo-clear[hidden]{display:none}.ag-combo-icon{position:absolute;right:13px;top:12px;pointer-events:none;opacity:.65}.ag-combo-menu{position:absolute;left:0;right:0;top:calc(100% + 3px);max-height:245px;overflow-y:auto;overscroll-behavior:contain;background:var(--card,#fff);background-color:#fff;color:#202b24;border:1px solid #b9c6bd;border-radius:10px;z-index:110;box-shadow:0 7px 22px #0003}.ag-combo-item{display:block;width:100%;text-align:left;padding:11px 13px;border:0;border-bottom:1px solid #e9eee9;background:#fff;color:#1d3325;font:inherit;cursor:pointer;overflow-wrap:anywhere}.ag-combo-item:focus,.ag-combo-item:hover,.ag-combo-item.ag-active{background:#e8f3ec}.ag-combo-empty{padding:12px;color:#56625a}';
document.head.appendChild(style);
}
for(const sel of [...document.querySelectorAll('select')]){
if(sel.id==='planLine')continue;
const options=[...sel.options].map(o=>({value:o.value,text:o.text,disabled:o.disabled}));
const isMain=['product','customer','quickCustomer','shareCustomer'].includes(sel.id);
if(!isMain&&options.length<12)continue;
if(sel.closest('.ag-combo'))continue;
const wrap=document.createElement('div');wrap.className='ag-combo';
sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);
sel.style.display='none';
const field=document.createElement('input');
field.type='text';field.className='ag-combo-input';field.autocomplete='off';
field.setAttribute('role','combobox');field.setAttribute('aria-autocomplete','list');field.setAttribute('aria-expanded','false');
const placeholder=options.find(o=>!o.value)?.text||'Selecciona una opción';
field.placeholder=sel.id==='product'?'':'🔎 '+placeholder;field.setAttribute('aria-label','Buscar '+(sel.id||'opción'));
const arrow=document.createElement('span');arrow.className='ag-combo-icon';arrow.textContent='⌄';
const clear=document.createElement('button');clear.type='button';clear.className='ag-combo-clear';clear.textContent='×';clear.title='Borrar selección y búsqueda';clear.setAttribute('aria-label','Borrar selección y búsqueda');clear.hidden=true;
const menu=document.createElement('div');menu.className='ag-combo-menu';menu.setAttribute('role','listbox');menu.hidden=true;
wrap.append(field,clear,arrow,menu);
let current=sel.value,activeIndex=-1,visible=[];
const selectedLabel=()=>options.find(o=>o.value===current)?.text||'';
const updateClear=()=>{clear.hidden=!field.value;};
const close=()=>{menu.hidden=true;field.setAttribute('aria-expanded','false');activeIndex=-1;};
const draw=(query)=>{
const normQuery=norm(query);
visible=options.filter(o=>o.value&&!o.disabled&&(!normQuery||norm(o.text).includes(normQuery))).slice(0,35);
menu.replaceChildren();
if(!visible.length){const item=document.createElement('div');item.className='ag-combo-empty';item.textContent='No hay coincidencias';menu.appendChild(item);}
for(let i=0;i<visible.length;i++){
const opt=visible[i],btn=document.createElement('button');btn.type='button';btn.className='ag-combo-item';btn.setAttribute('role','option');btn.textContent=opt.text;
btn.addEventListener('pointerdown',e=>e.preventDefault());
btn.addEventListener('click',()=>choose(opt));
menu.appendChild(btn);
}
activeIndex=-1;menu.hidden=false;field.setAttribute('aria-expanded','true');
};
const choose=(opt)=>{
current=opt.value;sel.value=opt.value;field.value=opt.text;close();updateClear();
sel.dispatchEvent(new Event('change',{bubbles:true}));
};
field.addEventListener('focus',()=>{field.select();draw('')});
field.addEventListener('input',()=>{if(current){current='';sel.value='';sel.dispatchEvent(new Event('change',{bubbles:true}));}updateClear();draw(field.value)});
clear.addEventListener('pointerdown',e=>e.preventDefault());
clear.addEventListener('click',()=>{const hadValue=!!current;current='';sel.value='';field.value='';updateClear();if(hadValue)sel.dispatchEvent(new Event('change',{bubbles:true}));field.focus();draw('');});
field.addEventListener('keydown',e=>{
if(e.key==='Escape'){close();field.value=selectedLabel();updateClear();field.blur();return;}
if(e.key==='ArrowDown'||e.key==='ArrowUp'){
e.preventDefault();if(menu.hidden)draw('');
if(visible.length){activeIndex=e.key==='ArrowDown'?(activeIndex+1)%visible.length:(activeIndex+visible.length-1)%visible.length;[...menu.children].forEach((x,i)=>x.classList.toggle('ag-active',i===activeIndex));menu.children[activeIndex]?.scrollIntoView({block:'nearest'});}
}
if(e.key==='Enter'&&!menu.hidden){e.preventDefault();if(visible.length===1)choose(visible[0]);else if(activeIndex>=0)choose(visible[activeIndex]);}
});
field.addEventListener('blur',()=>{setTimeout(()=>{if(!wrap.contains(document.activeElement)){close();field.value=selectedLabel();updateClear();}},120)});
sel.addEventListener('change',()=>{current=sel.value;field.value=selectedLabel();updateClear();});
field.value=selectedLabel();updateClear();
document.addEventListener('pointerdown',e=>{if(!wrap.contains(e.target)){close();field.value=selectedLabel();updateClear();}});
}
}

async function updateReviewedCatalog(file){
 if(syncBusy)throw Error('No actualices el catálogo mientras se sincroniza.');
 const data=JSON.parse(await file.text());
 if(data?.type!=='AgroStockProductCatalog'||Number(data.schema)<2||!Array.isArray(data.products)||!data.products.length||data.products.length>5000)throw Error('Selecciona el JSON del catálogo maestro revisado (versión 2).');
 const byCode=new Map(model.products.filter(p=>p.code).map(p=>[String(p.code).trim(),p]));
 const latest=new Map((model.productMappings||[]).map(x=>[x.productId,x]));
 let pending=[],unmatched=0,skipped=0;
 for(const row of data.products){
  if(!row||!row.code||!row.name){skipped++;continue}
  const p=byCode.get(String(row.code).trim());
  if(!p){unmatched++;continue}
  const prev=productMapping(p);
  // No sobrescribir verificaciones manuales posteriores ni añadir un nuevo producto duplicado.
  if(prev?.verified||prev?.confirmedNoRegistration){skipped++;continue}
  const currentName=String(prev?.familyName||stockDisplayName(p)).trim();
  const newName=String(row.familyName||'').trim();
  const newFormat=String(row.commercialFormat||'').trim();
  const originalFormat=String(p.package||'').trim();
  const newReg=String(row.registration??p.registration??'').trim();
  if(!newName||newName.length>150||newFormat.length>90){skipped++;continue}
  const differentName=norm(newName)!==norm(currentName);
  const differentFormat=!!newFormat&&norm(newFormat)!==norm(originalFormat)&&norm(newFormat)!==norm(prev?.format||'');
  const differentReg=newReg!==String(prev?.registration??p.registration??'').trim();
  if(!differentName&&!differentFormat&&!differentReg){skipped++;continue}
  pending.push({id:id(),productId:p.id,familyName:newName,format:newFormat||originalFormat,registration:newReg,verified:false,confirmedNoRegistration:false,at:stamp(),technician:model.tech,source:'Catálogo maestro revisado'});
 }
 const msg='Catálogo maestro leído:\n'+data.products.length+' referencias del archivo.\n'+pending.length+' correcciones asociadas a productos existentes.\n'+unmatched+' códigos no presentes (no se crearán ni borrarán).\n'+skipped+' sin cambios o reservadas para revisión manual.\n\nSe conservarán clientes, movimientos, catálogo original, códigos y fichas activas. Se incorporarán únicamente las correcciones por código. ¿Continuar?';
 if(!confirm(msg))return;
 if(!pending.length)return t('Sin cambios para aplicar. El catálogo original se conserva.');
 backup();
 model.productMappings.push(...pending);
 await save();productEditId='';render();
 t('Catálogo actualizado: '+pending.length+' correcciones. Sin borrar referencias ni movimientos.');
}
