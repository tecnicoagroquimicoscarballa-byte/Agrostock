<script>
'use strict';
const APP_RELEASE='103', APP_RELEASE_DATE='12/11/2026';
const VERSION=3, GOOGLE_OAUTH_CLIENT_ID='708665310867-i4kvrt02fpmqhac0pfipnhi7f899a625.apps.googleusercontent.com', DBNAME='AgroStockLocal_v1', STORE='database';
const U=['kg','g','L','cm³','ud.'];
let model={version:VERSION,tech:'Técnico 1',customers:[],products:[],movements:[],documents:[],plans:[],visits:[],orders:[],alerts:[],clientStatuses:[],productStatuses:[],productSelections:[],customerDirectory:[],productMappings:[],updated:''};
let screen='inicio',selected='',customerTab='stock',filter='',db=null, pendingAction=null, voiceOn=false,stockHistoryProductId='';
// Autorización Google Drive de prueba: token exclusivamente en memoria, nunca en IndexedDB o exportaciones.
let driveTokenClient=null, driveAccessToken=null, driveTokenExpires=0, driveStatus='No conectado';
const DRIVE_PREF_KEY='agrostock-drive-preferred-v1';
let drivePreferred=false;
try{drivePreferred=localStorage.getItem(DRIVE_PREF_KEY)==='1'}catch(e){}
const DRIVE_LOGIN_HINT_KEY='agrostock-drive-account-email-v1';
let driveLoginHint='';
try{driveLoginHint=localStorage.getItem(DRIVE_LOGIN_HINT_KEY)||''}catch(e){}
function saveDriveLoginHint(){
const value=String($('driveAccountEmail')?.value||'').trim().toLowerCase();
if(value&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))return t('Introduce una dirección de Google válida.','error');
driveLoginHint=value;
try{if(value)localStorage.setItem(DRIVE_LOGIN_HINT_KEY,value);else localStorage.removeItem(DRIVE_LOGIN_HINT_KEY)}catch(e){}
t('Cuenta preferida guardada para este dispositivo.');render();
}
function driveIsConnected(){return !!driveAccessToken&&Date.now()<driveTokenExpires-60000&&driveStatus.startsWith('Conexión comprobada')}
function driveStatusHTML(){
const connected=driveIsConnected();
const expired=!!driveAccessToken&&Date.now()>=driveTokenExpires-60000;
const state=connected?'🟢 Conectado a Google Drive':expired?'🟠 Sesión caducada; vuelve a conectar':drivePreferred?'🟡 Cuenta recordada; necesita autorización':'⚪ Sin conectar';
return `<div class="half card"><h2>☁️ Google Drive — conexión y sincronización</h2><p class="muted">Acceso limitado a la carpeta propia de AgroStock (drive.appdata).</p><div class="notice"><strong>Estado:</strong> ${esc(state)}<br>${esc(driveStatus)}<br><strong>Sincronización:</strong> ${autoSyncEnabled?'automática activada mientras Drive permanezca autorizado.':'manual (puedes activar la automática abajo).'}<br><strong>${esc(syncUiStatus())}</strong></div><div class="actions">${connected?'<button class="btn alt" id="driveDisconnect">Desconectar Google Drive</button>':'<button class="btn" id="driveConnect">Conectar Google Drive</button>'}</div><p class="small muted">${drivePreferred?'Se recuerda que quieres conectar esta cuenta en este dispositivo.':'La autorización puede recordarse como preferencia en este dispositivo.'} Los tokens de acceso se mantienen solo mientras esta sesión esté activa y caducan; por seguridad, en esta versión puede ser necesario pulsar «Conectar» después de cerrar la app. No se guardan contraseñas ni tokens en la base local.</p><div class="field"><label for="driveAccountEmail">Cuenta Google preferida (para evitar el selector)</label><input id="driveAccountEmail" type="email" placeholder="cuenta@gmail.com" value="${esc(driveLoginHint)}"></div><button type="button" class="btn alt" id="saveDriveAccount">Guardar cuenta preferida</button><p class="small muted">Solo se guarda el correo en este dispositivo. Google puede pedir autorización igualmente. Este ajuste no impide elegir otra cuenta si la configuración de Google lo permite.</p></div>`}
function loadGoogleIdentity(){return new Promise((res,rej)=>{if(window.google?.accounts?.oauth2)return res();if(document.getElementById('google-identity-script')){return rej(Error('Google Identity Services aún se está cargando; inténtalo de nuevo'))}let sc=document.createElement('script');sc.id='google-identity-script';sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=res;sc.onerror=()=>rej(Error('No se pudo cargar Google Identity Services. Comprueba la conexión'));document.head.append(sc)})}
async function driveConnect(){if(!navigator.onLine)return t('Para conectar Google Drive necesitas internet','error');driveStatus='Preparando autorización…';render();try{if(!window.google?.accounts?.oauth2)throw Error('El servicio de Google aún no está cargado; espera unos segundos y vuelve a pulsar');driveTokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_OAUTH_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.appdata',...(driveLoginHint?{login_hint:driveLoginHint}:{}),callback:async r=>{if(r.error){driveStatus='Error de autorización: '+r.error;render();return}driveAccessToken=r.access_token;driveTokenExpires=Date.now()+(Number(r.expires_in)||3600)*1000;driveStatus='Autorizado; comprobando acceso a appDataFolder…';render();try{let response=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=nextPageToken,files(id,name)&page_size=10',{headers:{Authorization:'Bearer '+driveAccessToken}});if(!response.ok)throw Error('Drive API HTTP '+response.status);let data=await response.json();driveStatus='Conexión comprobada. Archivos propios visibles: '+(data.files?.length||0)+'.';if(autoSyncEnabled)syncAutoSchedule(1200);drivePreferred=true;try{localStorage.setItem(DRIVE_PREF_KEY,'1')}catch(e){}}catch(e){driveStatus='Autorización concedida, pero fallo de API: '+e.message}render()}});driveTokenClient.requestAccessToken({prompt:'',...(driveLoginHint?{login_hint:driveLoginHint}:{})})}catch(e){driveStatus='No conectado: '+e.message;render()}}

const SYNC_NAME='agrostock-sync-v1.json',SYNC_KEYS=['customers','products','movements','documents','plans','visits','orders','alerts','clientStatuses','productStatuses','productSelections','customerDirectory','productMappings'];
let syncBusy=false,syncMessage='Todavía no se ha sincronizado en esta sesión.',autoSyncTimer=null,autoSyncPending=false,autoSyncLastSuccess='';
const SYNC_DIRTY_KEY='agrostock-pending-upload-v1';
let syncDirty=false;
try{syncDirty=localStorage.getItem(SYNC_DIRTY_KEY)==='1'}catch(e){}
function markSyncDirty(v){syncDirty=!!v;try{localStorage.setItem(SYNC_DIRTY_KEY,syncDirty?'1':'0')}catch(e){}}
function syncUiStatus(){
if(syncDirty)return '🟠 '+(model.pendingChanges?.length||1)+' operación(es) local(es) pendientes de comprobar con Google Drive.';
if(!driveIsConnected())return '🟡 Drive sin autorización activa; los datos locales están conservados.';
return autoSyncLastSuccess?'🟢 Última comprobación con Drive: '+autoSyncLastSuccess:'🔵 Conectado; pendiente de la primera comprobación.';
}

let autoSyncPoll=null;
function autoSyncHeartbeat(){if(!autoSyncEnabled||document.hidden||!navigator.onLine||!driveIsConnected()||syncBusy)return;syncAutoSchedule(1200);}
autoSyncPoll=setInterval(autoSyncHeartbeat,60000);
const AUTO_SYNC_KEY='agrostock-auto-sync-v1';
let autoSyncEnabled=false;
try{autoSyncEnabled=localStorage.getItem(AUTO_SYNC_KEY)==='1'}catch(e){}
function syncAutoSchedule(delay=2800){
if(!autoSyncEnabled||!navigator.onLine)return;
if(!driveIsConnected()){if(drivePreferred)driveStatus='Se necesita conectar Google Drive para enviar cambios pendientes';return;}
autoSyncPending=true;
clearTimeout(autoSyncTimer);
autoSyncTimer=setTimeout(async()=>{
if(!autoSyncEnabled||!driveIsConnected()||!navigator.onLine){autoSyncPending=false;return;}
if(syncBusy){syncAutoSchedule(4500);return;}
// Sincronizar aunque el foco permanezca en un campo después de guardar.
autoSyncPending=false;await syncNow(true);
},delay);
}
function syncAutoToggle(checked){
autoSyncEnabled=checked;
try{localStorage.setItem(AUTO_SYNC_KEY,checked?'1':'0')}catch(e){}
if(checked)syncAutoSchedule(800);else{clearTimeout(autoSyncTimer);autoSyncPending=false;}
render();
}
function syncPanel(){return '<div class="full card"><h2>🔄 Sincronización con Google Drive</h2><p>Une los registros de móvil y tablet sin duplicar identificadores. Comienza por el móvil, después sincroniza la tablet.</p><div class="notice"><b>'+esc(syncUiStatus())+'</b><br>'+esc(syncMessage)+(autoSyncLastSuccess?'<br><b>Última sincronización de esta sesión:</b> '+esc(autoSyncLastSuccess):'')+'</div><div class="actions"><button class="btn" id="syncNow" '+(!driveIsConnected()||syncBusy?'disabled':'')+'>'+(syncBusy?'Sincronizando…':'🔄 Sincronizar ahora')+'</button><button class="btn alt" id="syncBackup">⬇ Copia de seguridad</button></div><div style="margin-top:12px;padding:12px;border:1px solid #e4c58a;border-radius:10px"><b>Resolver conflicto de pruebas</b><p class="muted small">Utiliza los datos de ESTE dispositivo como copia principal de Drive. Crea respaldos local y remoto antes de sustituir la copia. No es una fusión entre móvil y tablet.</p><button class="btn alt" type="button" id="syncPreferLocal" '+(!driveIsConnected()||syncBusy?'disabled':'')+'>Usar datos de este dispositivo en Drive (pruebas)</button></div><label class="field" style="display:flex;align-items:center;gap:10px;margin:12px 0"><input type="checkbox" id="autoSyncToggle" '+(autoSyncEnabled?'checked':'')+'><span><b>Sincronización automática (pruebas)</b><br><small>Tras conectar Drive, al guardar cambios y al recuperar la conexión.</small></span></label><p class="small muted">Requiere internet y conexión autorizada. Experimental: mantén la misma cuenta en ambos dispositivos. No edites el mismo registro simultáneamente. Si hay versiones diferentes de un registro, se detiene sin sobrescribirlo. No desinstales la aplicación sin hacer una copia.</p></div>'}

function emptyTestDataset(){const next={...model,version:VERSION,syncEpoch:Math.max(Date.now(),Number(model.syncEpoch)||0)+1,updated:stamp()};for(const key of SYNC_KEYS)next[key]=[];return next;}


async function resetProductTrials(){
 if(syncBusy)return t('Hay una sincronización en curso. Prueba cuando termine.','error');
 if(!driveIsConnected()||!navigator.onLine)return t('Conecta Google Drive antes de reiniciar el catálogo en todos los dispositivos.','error');
 if(!confirm('REINICIAR SOLO PRODUCTOS DE PRUEBA\n\nSE CONSERVAN:\n- Directorio Carballa de clientes\n- Agricultores incorporados y sus datos\n- Visitas, pedidos, documentos y alertas\n\nSE BORRAN:\n- Catálogo de productos anterior, activaciones y clasificaciones\n- Compras, aplicaciones y revisiones de stock\n- Planes de abonado que contienen productos de prueba\n\nSe hará copia local y copia de Drive antes de modificar nada. ¿Continuar?'))return;
 if(prompt('Para confirmar escribe exactamente: REINICIAR PRODUCTOS')!=='REINICIAR PRODUCTOS')return t('Reinicio cancelado.');
 clearTimeout(autoSyncTimer);autoSyncPending=false;syncBusy=true;syncMessage='Reiniciando catálogo y movimientos de prueba…';render();
 try{
  const files=await driveFiles();if(files.length>1)throw Error('Hay varias copias principales en Drive. No se ha modificado nada.');
  const remote=files.length?await driveGet(files[0].id):null;
  if(remote&&(Number(remote.syncEpoch)||0)!==(Number(model.syncEpoch)||0))throw Error('La generación de Drive es distinta. Sincroniza antes de iniciar el reinicio.');
  const combined=remote?mergeCloud(model,remote):{...model};
  backup();
  if(remote)await drivePut('agrostock-respaldo-antes-de-reiniciar-productos-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',remote);
  const next={...combined,syncEpoch:Math.max(Date.now(),Number(combined.syncEpoch)||0)+1,updated:stamp(),pendingChanges:[],products:[],movements:[],plans:[],productStatuses:[],productSelections:[],productMappings:[]};
  const latest=await driveFiles();
  if(latest.length!==files.length||(latest.length&&String(latest[0].version)!==String(files[0].version)))throw Error('La copia de Drive ha cambiado. Reinicio cancelado.');
  await drivePut(SYNC_NAME,next,files[0]?.id);
  model=next;productEditId='';pendingAction=null;await dbPut();markSyncDirty(false);syncMessage='Catálogo anterior y movimientos de prueba reiniciados. Clientes conservados. Ya puedes importar el catálogo maestro nuevo.';t('Productos reiniciados. Clientes conservados.');
 }catch(e){syncMessage='No se pudo reiniciar: '+e.message;t(syncMessage,'error');console.error(e)}
 finally{syncBusy=false;render()}
}


function isIsonetLTTProduct(p){
 if(!p)return false;
 const raw=norm(String(p.name||'')),family=norm(String(stockDisplayName(p)||''));
 return /^isonet ltt(?:\s*\(\s*\d+\s*\))?$/.test(raw)||family==='isonet ltt';
}
async function clearTestMovements(){
if(syncBusy)return t('Hay una sincronización en curso. Repite la operación cuando termine.','error');
if(!driveIsConnected()||!navigator.onLine)return t('Conecta Google Drive para eliminar movimientos de prueba en móvil y tablet sin que reaparezcan.','error');
if(!confirm('¿Eliminar TODOS los movimientos de prueba (compras, aplicaciones, revisiones y otras salidas)?\n\nSe conservarán los clientes activos, directorio de clientes, catálogo de productos, incorporaciones, planes y demás información.\n\nSe descargará una copia de seguridad antes del borrado.'))return;
if(prompt('Para confirmar escribe exactamente: BORRAR MOVIMIENTOS')!=='BORRAR MOVIMIENTOS')return t('Borrado cancelado.');
clearTimeout(autoSyncTimer);autoSyncPending=false;syncBusy=true;syncMessage='Preparando limpieza de movimientos de prueba…';render();
try{

// An existing pending movement may have been split into one or more linked lots.
// Treat only that explicitly recorded transition as safe: never silently merge
// unrelated edits, different allocations, or concurrent customer/product changes.
function syncRegularizedSuccessor(a,b){
 if(!a||!b||!a.id||a.id!==b.id)return null;
 const pending=a.pendingPurchase===true?a:b.pendingPurchase===true?b:null;
 const linked=a.pendingPurchase===false&&a.linkedPurchaseId&&a.regularizedAt?a:b.pendingPurchase===false&&b.linkedPurchaseId&&b.regularizedAt?b:null;
 if(!pending||!linked||pending===linked)return null;
 if(!['tratamiento','salida'].includes(pending.kind)||linked.kind!==pending.kind)return null;
 if(!(Number(pending.delta)<0&&Number(linked.delta)<0&&Number(linked.delta)>=Number(pending.delta)-0.000001))return null;
 const unchanged=['id','customerId','productId','kind','date','operationId','recorded','technician','plot','area','notes','qtyUnit','planLine','before'];
 for(const field of unchanged)if(JSON.stringify(pending[field]??null)!==JSON.stringify(linked[field]??null))return null;
 if(pending.lot||!linked.lot||!linked.linkedPurchaseId)return null;
 return linked;
}
function mergeCloud(local,cloud){
ensure(local);ensure(cloud);
const out={...local};let conflicts=[];
for(const key of SYNC_KEYS){
const own=(local[key]||[]).map(x=>({...x})),byId=new Map(own.map((x,i)=>[x.id,i]));
for(const obj of cloud[key]||[]){
if(!obj||!obj.id)throw Error('Registro remoto sin ID en '+key);
if(!byId.has(obj.id)){byId.set(obj.id,own.length);own.push(obj);}
else{
const stable=x=>JSON.stringify(x,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){return Object.keys(v).sort().reduce((o,key)=>(o[key]=v[key],o),{});}return v;});
const existing=own[byId.get(obj.id)];
if(stable(existing)!==stable(obj)){
 const resolved=key==='movements'?syncRegularizedSuccessor(existing,obj):null;
 if(resolved)own[byId.get(obj.id)]={...resolved};
 else conflicts.push(key+'/'+obj.id);
}
}
}
out[key]=own;
}
if(conflicts.length)throw Error('Versiones distintas del mismo registro: '+conflicts.slice(0,2).join(', ')+'. No se modificó ningún dato. Descarga una copia de seguridad local antes de cualquier corrección.');
if(out.customers.filter(c=>!clientArchived(c.id,out)).length>100)throw Error('La unión supera 100 clientes activos; no se modificó ningún dato.');
return out;
}

function seedStock(p){
if(!p)return false;

// Las familias 51-54 del catálogo Carballa son semillas y material de siembra:
// el formato (gramos, número de semillas o bolsita) nunca determina la unidad de stock.
if(p.origin==='catalogo_carballa'&&/^5[1-4]\d{4}$/.test(String(p.code||'')))return true;
const name=norm(String(p.name||''));
if(p.origin==='catalogo_carballa'&&/^55\d{4}$/.test(String(p.code||''))&&/\bcesped\b/.test(name))return true;

function itemStock(p){

function lotSummary(cid,pid){
 const p=prod(pid);if(!p)return {lots:[],unassigned:0};
 const key=stockGroupKey(p),sums=new Map();let unassigned=0;
 for(const m of model.movements){
  if(m.customerId!==cid||stockGroupKey(prod(m.productId))!==key)continue;
  const d=movementStockDelta(m,prod(m.productId)),lot=String(m.lot||'').trim();
  if(m.kind==='asignacion_lote'){
   const moved=Number(m.lotQtyBase)||0;
   if(lot&&moved>0){const shift=['entrada','revision_positiva'].includes(m.sourceKind)?moved:-moved;sums.set(lot,(sums.get(lot)||0)+shift);unassigned-=shift;}
   continue;
  }
  if(lot)sums.set(lot,(sums.get(lot)||0)+d);else unassigned+=d;
 }
 return {lots:[...sums].map(([lot,amount])=>({lot,amount})).sort((a,b)=>a.lot.localeCompare(b.lot)),unassigned};
}

 const unassignedLabel=unassigned<-.000001?'Consumo pendiente de atribuir a un lote (ya descontado del saldo total)':unassigned>.000001?'Existencias sin lote indicado':'Sin lote';

function availablePurchaseForPending(purchase){
 const p=prod(purchase.productId);
 if(!p||purchase.kind!=='entrada'||!purchase.lot)return 0;
 const used=model.movements.filter(m=>m.linkedPurchaseId===purchase.id).reduce((sum,m)=>sum+Math.abs(movementStockDelta(m,prod(m.productId))),0);
 const gross=Math.max(0,movementStockDelta(purchase,p)-used);
 // The batch cannot be assigned to an old pending application if its stock was already used elsewhere.
 const balance=lotSummary(purchase.customerId,purchase.productId).lots.find(x=>x.lot===purchase.lot)?.amount||0;
 return Math.max(0,Math.min(gross,balance));
}
function eligiblePurchasesForPending(pending){
 const p=prod(pending.productId);if(!p)return [];
 const key=stockGroupKey(p);
 return model.movements.filter(m=>m.kind==='entrada'&&m.customerId===pending.customerId&&!!m.lot&&stockGroupKey(prod(m.productId))===key&&availablePurchaseForPending(m)>0.000001);
}
function pendingPurchaseState(){
 const remaining=new Map(),queues=new Map(),first=new Map();
 model.movements.forEach((m,i)=>{const key=m.operationId||m.id;if(!first.has(key))first.set(key,i)});
 const timeline=model.movements.map((m,i)=>({m,i})).sort((a,b)=>first.get(a.m.operationId||a.m.id)-first.get(b.m.operationId||b.m.id)||a.i-b.i);
 for(const {m} of timeline){
  const p=prod(m.productId);if(!p||!m.customerId)continue;
  const key=m.customerId+'::'+stockGroupKey(p);
  if(!queues.has(key))queues.set(key,[]);
  const queue=queues.get(key);
  if(m.pendingPurchase&&['tratamiento','salida'].includes(m.kind)&&m.delta<0){
   const amount=-m.delta;
   remaining.set(m.id,amount);queue.push({id:m.id,amount});
  }else if(m.kind==='entrada'){
   const linked=model.movements.filter(x=>x.linkedPurchaseId===m.id).reduce((n,x)=>n+Math.max(0,-movementStockDelta(x,prod(x.productId))),0);
   let credit=Math.max(0,movementStockDelta(m,p)-linked);
   for(const debt of queue){
    if(credit<=0.000001)break;
    const paid=Math.min(debt.amount,credit);
    debt.amount-=paid;credit-=paid;
    remaining.set(debt.id,Math.max(0,debt.amount));
   }
  }
 }
 return remaining;
}
function lotUnassignedMovementBalance(m){
 if(!m||m.lot||!['entrada','tratamiento','salida'].includes(m.kind))return 0;
 const total=Math.abs(movementStockDelta(m,prod(m.productId)));
 const linked=model.movements.filter(x=>x.kind==='asignacion_lote'&&x.pendingMovementId===m.id).reduce((n,x)=>n+Math.max(0,Number(x.lotQtyBase)||0),0);
 return Math.max(0,total-linked);
}

function updateRegularizationRemaining(form){

 let total=0,invalid=false;
 for(const line of form.querySelectorAll('.regularize-lot-row')){
  const select=line.querySelector('[name=purchaseId]'),qty=line.querySelector('[name=regularizeQty]'),label=line.querySelector('.regularize-availability');
  const purchase=info.options.find(x=>x.id===select.value),free=purchase?availablePurchaseForPending(purchase):0;
  const value=qty.value.trim(),amount=value===''?0:(discreteStock(info.p)?Number(value):toBase(num(value),info.p.unit));
  total+=Number.isFinite(amount)?amount:0;

 }
 const left=info.needed-total,box=form.querySelector('.regularize-remaining');
 if(box){
  box.textContent=(left>=-0.000001?'Falta por vincular: ':'Exceso: ')+fmt(fromStockBase(Math.abs(left),info.p))+' '+stockUnit(info.p);
  box.style.color=invalid||left<-.000001?'#a53024':'#145443';
 }
}

async function regularizePendingApplication(e){
 e.preventDefault();
 const form=e.target,info=regularizationRowInfo(form);
 if(!info||!info.m.pendingPurchase||!['tratamiento','salida'].includes(info.m.kind))return t('El pendiente ya no está disponible.','error');
 const {m,p,needed,options}=info,lines=[...form.querySelectorAll('.regularize-lot-row')];
 if(!lines.length)return t('Añade al menos una compra y lote.','error');
 const allocations=[],usedPurchases=new Set(),byLot=new Map();
 let assigned=0;
 for(const line of lines){
  const purchase=options.find(x=>x.id===line.querySelector('[name=purchaseId]').value);
  const qty=line.querySelector('[name=regularizeQty]'),base=discreteStock(p)?Number(qty.value):toBase(num(qty.value),p.unit);
  if(!purchase||!qty.value||!Number.isFinite(base)||base<=0)return t('Introduce una cantidad positiva en cada lote.','error');
  if(usedPurchases.has(purchase.id))return t('La misma compra aparece en más de una línea.','error');
  if(base>availablePurchaseForPending(purchase)+0.000001)return t('Superas la cantidad disponible para vincular del lote '+purchase.lot+'.','error');
  usedPurchases.add(purchase.id);assigned+=base;
  const lk=purchase.lot.toLowerCase();byLot.set(lk,(byLot.get(lk)||0)+base);
  allocations.push({purchase,base});
 }
 if(assigned>needed+0.000001)return t('La suma asignada supera el pendiente del tratamiento.','error');
 for(const [lot,total] of byLot){
  const available=lotSummary(m.customerId,m.productId).lots.filter(x=>x.lot.toLowerCase()===lot).reduce((sum,x)=>sum+x.amount,0);
  if(total>available+0.000001)return t('Las cantidades seleccionadas superan el saldo del lote '+lot+'.','error');
 }
 const remaining=Math.max(0,needed-assigned);
 const linesSummary=allocations.map(x=>'Lote '+x.purchase.lot+': '+fmt(fromStockBase(x.base,p))+' '+stockUnit(p)).join('\n');
 const msg='Regularizar '+stockDisplayName(p)+'\n'+linesSummary+'\n'+
 (remaining>0.000001?'Seguirá pendiente: '+fmt(fromStockBase(remaining,p))+' '+stockUnit(p)+'\n':'')+
 'El saldo TOTAL no cambia y no se repetirá el descuento del tratamiento. ¿Confirmas?';
 if(!confirm(msg))return;
 const index=model.movements.indexOf(m),original={...m},before=model.movements.length,when=stamp();
 const children=allocations.map(({purchase,base},i)=>({
  ...m,id:i===0?m.id:id(),delta:-base,
  qty:discreteStock(p)?base:fromBase(base,m.qtyUnit),
  lot:purchase.lot,pendingPurchase:false,pendingLot:false,pendingReason:'',
  linkedPurchaseId:purchase.id,regularizedAt:when
 }));
 model.movements[index]=children[0];
 model.movements.push(...children.slice(1));
 if(remaining>0.000001)model.movements.push({...m,id:id(),delta:-remaining,qty:discreteStock(p)?remaining:fromBase(remaining,m.qtyUnit),lot:'',pendingPurchase:true,pendingLot:true,linkedPurchaseId:null});
 try{await save()}catch(err){model.movements[index]=original;model.movements.length=before;return t('No se pudo guardar la regularización: '+err.message,'error')}
 render();t('Lotes vinculados en una sola operación. El stock total no se ha descontado de nuevo.');
}

function movementTable(arr,withClient=false){
 arr=arr.filter(m=>m.kind!=='asignacion_lote');
 if(!arr.length)return '<div class="empty">No hay movimientos registrados.</div>';
 const grouped=new Map(),balances=pendingPurchaseState();
 for(const m of arr){
  const p=prod(m.productId),out=['tratamiento','salida'].includes(m.kind);
  const key=out&&m.operationId&&p?m.operationId+'::'+m.customerId+'::'+stockGroupKey(p)+'::'+m.kind:m.id;
  if(!grouped.has(key))grouped.set(key,[]);
  grouped.get(key).push(m);
 }
 const position=new Map(model.movements.map((m,i)=>[m.id,i]));
 const rows=[...grouped.values()].sort((a,b)=>Math.min(...b.map(x=>position.get(x.id)??0))-Math.min(...a.map(x=>position.get(x.id)??0)));
 return '<div class="tablewrap"><table><thead><tr><th>Fecha</th>'+(withClient?'<th>Cliente</th>':'')+'<th>Operación</th><th>Producto</th><th>Cantidad</th><th>Lote</th><th>Notas</th></tr></thead><tbody>'+rows.map(group=>{
  const m=group[0],p=prod(m.productId),out=['tratamiento','salida'].includes(m.kind);
  const total=group.reduce((n,x)=>n+Math.abs(movementStockDelta(x,prod(x.productId))),0);
  const oldDeficit=group.filter(x=>x.pendingPurchase).reduce((n,x)=>n+Math.abs(movementStockDelta(x,prod(x.productId))),0);
  const still=group.reduce((n,x)=>n+(balances.get(x.id)||0),0);
  const originallyCovered=Math.max(0,total-oldDeficit);
  const batchNames=[...new Set(group.map(x=>x.lot).filter(Boolean))];
  const lotLabel=batchNames.length===0?'Sin lote (opcional)':batchNames.length===1?batchNames[0]:batchNames.length+' lotes';
  const observed=m.kind==='revision'?Number(m.after??(Number(m.before||0)+Number(m.delta||0))):null;
  const amount=m.kind==='revision'?'Observado: '+fmt(fromStockBase(observed,p))+' '+stockUnit(p):out?'−'+fmt(fromStockBase(total,p))+' '+stockUnit(p):
    m.kind==='entrada'&&Number.isFinite(m.packCount)&&m.packCount>0?
    (discreteStock(p)?fmt(m.packCount)+' '+stockUnit(p)+' (formato comercial)':fmt(m.packCount)+' envase'+(m.packCount===1?'':'s')+(m.packSize?' × '+fmt(m.packSize)+' '+(p?.unit||m.qtyUnit):'')):signed(m);
  let detail='';
  if(m.kind==='revision')detail='<div class="muted small">Existencias teóricas anteriores: '+esc(fmt(fromStockBase(Number(m.before||0),p))+' '+stockUnit(p))+' · Ajuste calculado: '+signed(m)+'</div>';
  if(oldDeficit>0.000001){
   detail='<div class="muted small">Al aplicar: '+esc(fmt(fromStockBase(originallyCovered,p))+' '+stockUnit(p))+' con existencias · '+esc(fmt(fromStockBase(oldDeficit,p))+' '+stockUnit(p))+' por confirmar compra</div>';
   detail+=still>0.000001?'<div class="pill red" style="display:inline-block;margin-top:4px">Pendiente compra: '+esc(fmt(fromStockBase(still,p))+' '+stockUnit(p))+'</div>':'<div class="muted small">Déficit cubierto por compras posteriores</div>';
  }
  const linkedLotNotes=model.movements.filter(x=>x.kind==='asignacion_lote'&&group.some(m=>m.id===x.pendingMovementId));
  if(linkedLotNotes.length)detail+='<div class="muted small">Lotes asignados posteriormente: '+esc(linkedLotNotes.map(x=>x.lot+' ('+fmt(fromStockBase(x.lotQtyBase,p))+' '+stockUnit(p)+')').join(' · '))+'</div>';
  if(group.length>1)detail+='<details style="margin-top:5px"><summary class="muted small" style="cursor:pointer">Ver desglose ('+group.length+' líneas)</summary>'+group.map(x=>'<div class="muted small">'+esc(fmt(fromStockBase(Math.abs(movementStockDelta(x,prod(x.productId))),p))+' '+stockUnit(p)+' · '+(x.lot?'Lote '+x.lot:'Sin lote'))+'</div>').join('')+'</details>';
  return '<tr><td>'+esc(m.date)+'</td>'+(withClient?'<td>'+esc(cName(m.customerId))+'</td>':'')
   +'<td><span class="pill '+(m.kind==='tratamiento'?'warn':m.kind==='revision'?'red':'')+'">'+esc(({entrada:'Compra/entrada',tratamiento:'Aplicación',revision:'Ajuste revisión',salida:'Otra salida'})[m.kind]||m.kind)+'</span></td>'
   +'<td>'+esc(m.kind==='entrada'?pName(m.productId):stockDisplayName(p))+'</td>'
   +'<td><b>'+esc(amount)+'</b>'+(m.kind==='entrada'&&Number.isFinite(m.packCount)&&m.packCount>0?'<div class="muted small">Total almacén: '+esc(signed(m))+'</div>':'')+detail+'</td>'
   +'<td class="small">'+esc(lotLabel)+(batchNames.length&&group.some(x=>!x.lot)?'<div class="muted small">Y parte sin lote</div>':'')+'</td>'
   +'<td class="small">'+esc(m.notes||'')+(m.plot?' · Parcela: '+esc(m.plot):'')+(m.area?' · '+fmt(m.area)+' ha':'')+'</td></tr>';
 }).join('')+'</tbody></table></div>';
}

async function multiSubmit(e){
 e.preventDefault();const form=e.target,rows=[...form.querySelectorAll('.multi-row')];if(!rows.length)return t('Añade un producto como mínimo.','error');
 let moves;
 try{
  // Each outgoing product has one overall quantity, independently distributed by lot.
  if(['tratamiento','salida'].includes(form.multiKind.value)){
   for(const [i,row] of rows.entries()){
    const p=prod(row.querySelector('[name=lineProduct]').value);
    const fld=row.querySelector('[name=totalUsed]');
    if(!p||!fld||!fld.value||!Number.isFinite(Number(fld.value))||Number(fld.value)<=0)throw Error('Producto '+(i+1)+': indica la cantidad total utilizada.');

    for(const line of row.querySelectorAll('.multi-lot-line')){
     const q=line.querySelector('[name=lineQty]').value;
     const lot=line.querySelector('[name=lineLot]').value.trim();
     const u=line.querySelector('[name=lineUnit]').value;
     if(!q&&!lot)continue; // Fila adicional vacía: no genera ningún movimiento.
     if(!q||!Number.isFinite(Number(q))||Number(q)<=0)throw Error('Producto '+(i+1)+': indica una cantidad positiva en cada lote seleccionado.');
     sum+=discreteStock(p)?Number(q):toBase(Number(q),u);
    }

     throw Error('Producto '+(i+1)+': los lotes superan la cantidad total en '+fmt(fromStockBase(sum-total,p))+' '+stockUnit(p)+'.');
   }
  }
  moves=rows.flatMap((row,i)=>{
   const p=prod(row.querySelector('[name=lineProduct]').value);
   if(!p)throw Error('Producto '+(i+1)+': selecciona un producto.');
   const all=[...row.querySelectorAll('.multi-lot-line')];
   const filled=all.filter(line=>line.querySelector('[name=lineQty]').value.trim()||line.querySelector('[name=lineLot]').value.trim());
   const outgoing=['tratamiento','salida'].includes(form.multiKind.value);
   if(!outgoing&&!filled.length)throw Error('Producto '+(i+1)+': indica al menos una cantidad.');
   const result=filled.map((lot,j)=>{try{return multiBuildMove(form,row,lot)}catch(e){throw Error('Producto '+(i+1)+' línea '+(j+1)+': '+e.message)}});
   if(outgoing){
    const field=row.querySelector('[name=totalUsed]');
    const total=discreteStock(p)?Number(field.value):toBase(Number(field.value),p.unit);
    const assigned=result.reduce((sum,m)=>sum-Math.min(0,m.delta),0);

       qty:discreteStock(p)?missing:fromBase(missing,p.unit),qtyUnit:discreteStock(p)?'ud.':p.unit,
       lot:'',plot:form.multiPlot.value,area:form.multiArea.value,notes:form.multiNotes.value,planLine:''};
     for(const [key,value] of Object.entries(values))f.set(key,String(value??''));

   }

  });

    if(m.lot){const lk=key+'::'+m.lot.toLowerCase(),l=byLot.get(lk)||{pid:m.productId,lot:m.lot,out:0};l.out-=m.delta;byLot.set(lk,l);}
   }

   for(const l of byLot.values()){const record=lotSummary(selected,l.pid).lots.find(x=>x.lot.toLowerCase()===l.lot.toLowerCase());if(!record||l.out>record.amount+0.000001)throw Error('Existencias insuficientes del lote '+l.lot+'.');}

async function updateReviewedCatalog(file){
 if(syncBusy)throw Error('No actualices el catálogo mientras se sincroniza.');
 const data=JSON.parse(await file.text());
 if(data?.type!=='AgroStockProductCatalog'||Number(data.schema)<2||!Array.isArray(data.products)||!data.products.length||data.products.length>5000)throw Error('Selecciona el JSON del catálogo maestro revisado (versión 2).');
 const byCode=new Map(model.products.filter(p=>p.code).map(p=>[String(p.code).trim(),p]));
 const latest=new Map((model.productMappings||[]).map(x=>[x.productId,x]));
 let pending=[],unmatched=0,skipped=0;
 for(const row of data.products){
  if(!row||!row.code||!row.name){skipped++;continue}
  const p=byCode.get(String(row.code).trim());
  if(!p){unmatched++;continue}
  const prev=productMapping(p);
  // No sobrescribir verificaciones manuales posteriores ni añadir un nuevo producto duplicado.
  if(prev?.verified||prev?.confirmedNoRegistration){skipped++;continue}
  const currentName=String(prev?.familyName||stockDisplayName(p)).trim();
  const newName=String(row.familyName||'').trim();
  const newFormat=String(row.commercialFormat||'').trim();
  const originalFormat=String(p.package||'').trim();
  const newReg=String(row.registration??p.registration??'').trim();
  if(!newName||newName.length>150||newFormat.length>90){skipped++;continue}
  const differentName=norm(newName)!==norm(currentName);
  const differentFormat=!!newFormat&&norm(newFormat)!==norm(originalFormat)&&norm(newFormat)!==norm(prev?.format||'');
  const differentReg=newReg!==String(prev?.registration??p.registration??'').trim();
  if(!differentName&&!differentFormat&&!differentReg){skipped++;continue}
  pending.push({id:id(),productId:p.id,familyName:newName,format:newFormat||originalFormat,registration:newReg,verified:false,confirmedNoRegistration:false,at:stamp(),technician:model.tech,source:'Catálogo maestro revisado'});
 }
 const msg='Catálogo maestro leído:\n'+data.products.length+' referencias del archivo.\n'+pending.length+' correcciones asociadas a productos existentes.\n'+unmatched+' códigos no presentes (no se crearán ni borrarán).\n'+skipped+' sin cambios o reservadas para revisión manual.\n\nSe conservarán clientes, movimientos, catálogo original, códigos y fichas activas. Se incorporarán únicamente las correcciones por código. ¿Continuar?';
 if(!confirm(msg))return;
 if(!pending.length)return t('Sin cambios para aplicar. El catálogo original se conserva.');
 backup();
 model.productMappings.push(...pending);
 await save();productEditId='';render();
 t('Catálogo actualizado: '+pending.length+' correcciones. Sin borrar referencias ni movimientos.');
}

async function importProductCatalog(file){
if(syncBusy)throw Error('Termina primero la sincronización actual.');
const parsed=JSON.parse(await file.text());
if(parsed?.type!=='AgroStockProductCatalog'||!Array.isArray(parsed.products)||!parsed.products.length||parsed.products.length>5000)throw Error('El archivo no es un catálogo de productos válido de AgroStock.');
const allowedCategory=new Set(['fitosanitario','fertilizante','enmienda','difusor','semillas','material','otro']);
const allowedUnit=new Set(U), ids=new Set(model.products.map(p=>p.id)),codes=new Set(model.products.map(p=>String(p.code||'')).filter(Boolean)),names=new Set(model.products.map(p=>norm(p.name)));
let add=[],ignored=0,pending=0,invalid=0;
for(const item of parsed.products){
if(!item||typeof item.name!=='string'||!item.name.trim()||typeof item.code!=='string'||!item.code.trim()||!allowedUnit.has(item.unit)||!allowedCategory.has(item.category)){invalid++;continue;}
const key='carballa-'+item.code.trim();
if(ids.has(key)||codes.has(item.code.trim())||names.has(norm(item.name))){ignored++;continue;}
const p={id:key,code:item.code.trim(),name:item.name.trim(),unit:item.unit,category:item.category,registration:String(item.registration||'').trim(),registrationSource:item.registrationSource||'Listado Carballa (pendiente comprobación oficial)',origin:'catalogo_carballa',package:item.package||'',sourceType:item.sourceType||'',categoryPendingReview:!!item.categoryPendingReview,created:stamp(),familyName:String(item.familyName||'').trim(),commercialFormat:String(item.commercialFormat||'').trim(),stockMode:['envases','contenido','unidades'].includes(item.stockMode)?item.stockMode:undefined,regulatoryClassification:String(item.regulatoryClassification||'').trim(),regulatoryEvidence:String(item.regulatoryEvidence||'').trim(),registroEstado:String(item.registroEstado||'PENDIENTE_VERIFICACION_OFICIAL').trim()};
add.push(p);ids.add(key);codes.add(p.code);names.add(norm(p.name));if(p.categoryPendingReview)pending++;
}
if(!add.length)return t('No hay productos nuevos que importar ('+ignored+' ya existentes).');
if(!confirm('Se añadirán '+add.length+' referencias comerciales únicas del catálogo Carballa.\n\n'+pending+' tienen clasificación comercial pendiente.\n'+ignored+' existentes se conservarán sin duplicar.\n\nEl número MAPA que aparece en el archivo NO significa que el registro esté verificado o vigente.\n\n¿Continuar con la importación?'))return;
model.products.push(...add);await save();render();t('Catálogo importado: '+add.length+' productos nuevos');
alert('Importación terminada.\nProductos añadidos: '+add.length+'\nCoincidencias omitidas: '+ignored+'\nRegistros no válidos: '+invalid+'\n\nComprueba que Google Drive sincronice antes de trabajar en la tablet.');
}

function commercialPack(p){
if(!p)return null;
const mapped=productMapping(p);if(mapped?.format){const mm=mapped.format.match(/(\d+(?:[.,]\d+)?)\s*(kg|g|gr|l|litros?|ml|cm³|cm3|ud\.?|unidades?)/i);if(mm){const u=/^kg$/i.test(mm[2])?'kg':/^(g|gr)$/i.test(mm[2])?'g':/^l/i.test(mm[2])?'L':/^ml$/i.test(mm[2])?'cm³':/^cm/i.test(mm[2])?'cm³':'ud.';if(baseUnit(u)===baseUnit(p.unit))return {size:fromBase(toBase(Number(mm[1].replace(',','.')),u),p.unit),unit:p.unit,source:mm[0]};}}
const normText=x=>String(x||'').toUpperCase().replace(/,/g,'.').replace(/\s+/g,' ').trim();
const text=normText(p.commercialFormat||p.package),name=normText(p.name);
const parseSize=(source)=>{
const matches=[...source.matchAll(/(\d+(?:\.\d+)?)\s*(KG|KGS|GRS?\.?|GRAMOS?|G|LITROS?|LITRO|LTS?\.?|LT\.?|ML|C\.?C\.?|CM3|CM³|UNIDADES?|UNID\.?|UDS?\.?|PCE|PIEZAS?)(?![A-Z])/g)];
if(!matches.length)return null;
const found=matches[matches.length-1],n=Number(found[1]),label=found[2].replace(/\./g,'');
if(!Number.isFinite(n)||n<=0)return null;
let unit=label.startsWith('KG')?'kg':label.startsWith('GR')||label==='G'?'g':label.startsWith('ML')||label==='CC'||label.startsWith('CM')?'cm³':label.startsWith('L')?'L':'ud.';
if(label==='ML')unit='cm³';
if(baseUnit(unit)!==baseUnit(p.unit))return null;
const inStockUnit=fromBase(toBase(n,unit),p.unit);
return {size:inStockUnit,unit:p.unit,source:found[0].trim()};
};
let size=parseSize(text);
if(!size){
const tail=name.match(/(?:^|[\s/,;-])(\d+(?:\.\d+)?)\s*(KG|KGS|GRS?\.?|GRAMOS?|G|LITROS?|LITRO|LTS?\.?|LT\.?|ML|C\.?C\.?|CM3|CM³|UNIDADES?|UNID\.?|UDS?\.?|PCE|PIEZAS?)\s*$/);
size=parseSize(tail?tail[0]:'');
}

async function submitVisit(e){e.preventDefault();let f=new FormData(e.target),customerId=f.get('customer'),notes=String(f.get('notes')||'').trim();if(!cust(customerId)||!notes)return t('Selecciona productor y escribe una nota','error');model.visits.push({id:id(),customerId,date:f.get('date')||today(),plot:String(f.get('plot')||''),notes,created:stamp(),technician:model.tech});await save();selected=customerId;render();t('Visita guardada')}
function ordersList(cid=''){let arr=model.orders.filter(o=>!cid||o.customerId===cid).sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));return arr.length?arr.map(o=>`<div class="filetile" style="margin:8px 0"><div class="row between"><b>${esc(cName(o.customerId))}</b><span class="pill ${o.status==='pendiente'?'warn':''}">${esc(o.status)}</span></div><p class="muted small">${esc(o.date)} · ${esc(o.technician||'')}</p><p style="white-space:pre-wrap;margin:8px 0">${esc(o.details)}</p><div class="actions">${o.status==='pendiente'?`<button class="btn alt" data-order-status="${esc(o.id)}" data-status="entregado">Marcar entregado</button>`:''}<button class="btn alt" data-order-status="${esc(o.id)}" data-status="cancelado">Marcar cancelado</button></div></div>`).join(''):'<div class="empty">Sin pedidos registrados.</div>'}
function ordersScreen(){return `${head('Pedidos por productor','Dicta o escribe los envases comerciales solicitados. El pedido conserva los sobres, cajas o sacos y sus formatos, sin convertirlos a kg ni litros. NO altera el stock.')}<div class="grid"><div class="half card"><h2>Nuevo pedido</h2><form id="createOrder" class="stack">${select('Productor *','customer',customerOptions(selected))}${input('Fecha','date','date',today(),'required')}<div class="field"><label>Detalle del pedido *</label><textarea id="orderDetails" name="details" required placeholder="Ej.: 10 sobres de semillas de 100 g, 3 garrafas de 5 L de producto X. Entrega el viernes."></textarea></div><div class="actions"><button class="btn alt" type="button" data-dictate="orderDetails">🎤 Dictar pedido</button><button class="btn">Guardar pedido pendiente</button></div></form><div class="notice" style="margin-top:10px">El pedido se conserva tal como lo escribes: «10 sobres de 100 g» seguirá siendo 10 sobres, sin sustituirse por 1.000 g. No se añade ni descuenta stock. Cuando se entregue, registra la entrega real por separado en Movimientos. Marcarlo entregado solo actualiza su estado.</div></div><div class="half card"><h2>Pedidos (${model.orders.length})</h2>${ordersList()}</div></div>`}
async function submitOrder(e){e.preventDefault();let f=new FormData(e.target),customerId=f.get('customer'),details=String(f.get('details')||'').trim();if(!cust(customerId)||!details)return t('Selecciona productor y detalla el pedido','error');model.orders.push({id:id(),customerId,date:f.get('date')||today(),details,status:'pendiente',created:stamp(),technician:model.tech});await save();selected=customerId;render();t('Pedido pendiente guardado')}
function dictateTo(targetId){let target=$(targetId),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!target)return;if(!SR)return t('Utiliza el micrófono del teclado: este navegador no permite dictado directo.','error');let r=new SR;r.lang='es-ES';r.interimResults=false;r.onresult=e=>{target.value=(target.value+' '+e.results[0][0].transcript).trim();t('Dictado incorporado. Revísalo antes de guardar.')};r.onerror=e=>t('No se pudo dictar: '+e.error,'error');try{r.start()}catch(e){t('No se pudo iniciar el micrófono','error')}}

function exportExtraCSV(kind){let rows=[];if(kind==='visits'){rows=[['Fecha','Cliente','Técnico','Parcela','Notas']];model.visits.forEach(v=>rows.push([v.date,cName(v.customerId),v.technician,v.plot,v.notes]))}else if(kind==='orders'){rows=[['Fecha','Cliente','Técnico','Estado','Detalle']];model.orders.forEach(o=>rows.push([o.date,cName(o.customerId),o.technician,o.status,o.details]))}else{rows=[['Cliente','Parcela','Días configurados','Última aplicación','Días transcurridos','Estado','Motivo']];allAlertStates().forEach(a=>rows.push([cName(a.customerId),a.plot,a.days,a.last?.date||'',a.elapsed??'',a.state,a.reason]))}csv(rows,'AgroStock_'+kind+'_'+today()+'.csv');t('Informe CSV descargado')}
