function loadGoogleIdentity(){return new Promise((res,rej)=>{if(window.google?.accounts?.oauth2)return res();if(document.getElementById('google-identity-script')){return rej(Error('Google Identity Services aún se está cargando; inténtalo de nuevo'))}let sc=document.createElement('script');sc.id='google-identity-script';sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=res;sc.onerror=()=>rej(Error('No se pudo cargar Google Identity Services. Comprueba la conexión'));document.head.append(sc)})}
async function driveConnect(){if(!navigator.onLine)return t('Para conectar Google Drive necesitas internet','error');driveStatus='Preparando autorización…';render();try{if(!window.google?.accounts?.oauth2)throw Error('El servicio de Google aún no está cargado; espera unos segundos y vuelve a pulsar');driveTokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_OAUTH_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.appdata',callback:async r=>{if(r.error){driveStatus='Error de autorización: '+r.error;render();return}driveAccessToken=r.access_token;driveTokenExpires=Date.now()+(Number(r.expires_in)||3600)*1000;driveStatus='Autorizado; comprobando acceso a appDataFolder…';render();try{let response=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=nextPageToken,files(id,name)&page_size=10',{headers:{Authorization:'Bearer '+driveAccessToken}});if(!response.ok)throw Error('Drive API HTTP '+response.status);let data=await response.json();driveStatus='Conexión comprobada. Archivos propios visibles: '+(data.files?.length||0)+'.';if(autoSyncEnabled)syncAutoSchedule(1200);drivePreferred=true;try{localStorage.setItem(DRIVE_PREF_KEY,'1')}catch(e){}}catch(e){driveStatus='Autorización concedida, pero fallo de API: '+e.message}render()}});driveTokenClient.requestAccessToken({prompt:'consent'})}catch(e){driveStatus='No conectado: '+e.message;render()}}

const SYNC_NAME='agrostock-sync-v1.json',SYNC_KEYS=['customers','products','movements','documents','plans','visits','orders','alerts','clientStatuses'];
let syncBusy=false,syncMessage='Todavía no se ha sincronizado en esta sesión.',autoSyncTimer=null,autoSyncPending=false,autoSyncLastSuccess='';
const SYNC_DIRTY_KEY='agrostock-pending-upload-v1';
let syncDirty=false;
try{syncDirty=localStorage.getItem(SYNC_DIRTY_KEY)==='1'}catch(e){}
function markSyncDirty(v){syncDirty=!!v;try{localStorage.setItem(SYNC_DIRTY_KEY,syncDirty?'1':'0')}catch(e){}}
function syncUiStatus(){
if(syncDirty)return '🟠 Cambios guardados en este dispositivo; pendientes de sincronizar con Google Drive.';
if(!driveIsConnected())return '🟡 Drive sin autorización activa; los datos locales están conservados.';
return autoSyncLastSuccess?'🟢 Última comprobación con Drive: '+autoSyncLastSuccess:'🔵 Conectado; pendiente de la primera comprobación.';
}

let autoSyncPoll=null;
function autoSyncHeartbeat(){if(!autoSyncEnabled||document.hidden||!navigator.onLine||!driveIsConnected()||syncBusy)return;syncAutoSchedule(1200);}
autoSyncPoll=setInterval(autoSyncHeartbeat,60000);
const AUTO_SYNC_KEY='agrostock-auto-sync-v1';
let autoSyncEnabled=false;
try{autoSyncEnabled=localStorage.getItem(AUTO_SYNC_KEY)==='1'}catch(e){}
function syncAutoSchedule(delay=2800){
if(!autoSyncEnabled||!navigator.onLine)return;
if(!driveIsConnected()){if(drivePreferred)driveStatus='Se necesita conectar Google Drive para enviar cambios pendientes';return;}
autoSyncPending=true;
clearTimeout(autoSyncTimer);
autoSyncTimer=setTimeout(async()=>{
if(!autoSyncEnabled||!driveIsConnected()||!navigator.onLine){autoSyncPending=false;return;}
if(syncBusy){syncAutoSchedule(4500);return;}
if(document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&document.activeElement.value){syncAutoSchedule(12000);return;}
autoSyncPending=false;await syncNow(true);
},delay);
}
function syncAutoToggle(checked){
autoSyncEnabled=checked;
try{localStorage.setItem(AUTO_SYNC_KEY,checked?'1':'0')}catch(e){}
if(checked)syncAutoSchedule(800);else{clearTimeout(autoSyncTimer);autoSyncPending=false;}
render();
}
function syncPanel(){return '<div class="full card"><h2>🔄 Sincronización con Google Drive</h2><p>Une los registros de móvil y tablet sin duplicar identificadores. Comienza por el móvil, después sincroniza la tablet.</p><div class="notice"><b>'+esc(syncUiStatus())+'</b><br>'+esc(syncMessage)+(autoSyncLastSuccess?'<br><b>Última sincronización de esta sesión:</b> '+esc(autoSyncLastSuccess):'')+'</div><div class="actions"><button class="btn" id="syncNow" '+(!driveIsConnected()||syncBusy?'disabled':'')+'>'+(syncBusy?'Sincronizando…':'🔄 Sincronizar ahora')+'</button><button class="btn alt" id="syncBackup">⬇ Copia de seguridad</button></div><label class="field" style="display:flex;align-items:center;gap:10px;margin:12px 0"><input type="checkbox" id="autoSyncToggle" '+(autoSyncEnabled?'checked':'')+'><span><b>Sincronización automática (pruebas)</b><br><small>Tras conectar Drive, al guardar cambios y al recuperar la conexión.</small></span></label><p class="small muted">Requiere internet y conexión autorizada. Experimental: mantén la misma cuenta en ambos dispositivos. No edites el mismo registro simultáneamente. Si hay versiones diferentes de un registro, se detiene sin sobrescribirlo. No desinstales la aplicación sin hacer una copia.</p></div>'}

function emptyTestDataset(){const next={...model,version:VERSION,syncEpoch:Math.max(Date.now(),Number(model.syncEpoch)||0)+1,updated:stamp()};for(const key of SYNC_KEYS)next[key]=[];return next;}
async function clearTestDataset(){
if(syncBusy)return t('Existe una sincronización en curso; espera a que termine.','error');
if(!driveIsConnected()||!navigator.onLine)return t('Conecta Google Drive antes de reiniciar los datos de prueba.','error');
if(!confirm('ATENCIÓN: se vaciarán clientes, productos, movimientos, planes, documentos, visitas, pedidos y alertas en este perfil y en la copia sincronizada. Se descargarán copias de seguridad. ¿Continuar?'))return;
if(prompt('Para confirmar escribe exactamente: BORRAR PRUEBAS')!=='BORRAR PRUEBAS')return t('Reinicio cancelado.');
clearTimeout(autoSyncTimer);autoSyncPending=false;syncBusy=true;syncMessage='Preparando reinicio…';render();
try{
const files=await driveFiles();if(files.length>1)throw Error('Hay varias copias principales. No se han eliminado datos.');
const remote=files.length?await driveGet(files[0].id):null;
if(remote&&(Number(remote.syncEpoch)||0)>(Number(model.syncEpoch)||0))throw Error('Drive tiene un reinicio más reciente. Sincroniza primero.');
const next=emptyTestDataset();
if(remote)next.syncEpoch=Math.max(next.syncEpoch,(Number(remote.syncEpoch)||0)+1);
backup();
if(remote)await drivePut('agrostock-respaldo-antes-de-reinicio-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',remote);
const latest=await driveFiles();
if(latest.length!==files.length||(latest.length&&String(latest[0].version)!==String(files[0].version)))throw Error('La copia de Drive ha cambiado. Reinicio cancelado sin eliminar registros.');
await drivePut(SYNC_NAME,next,files[0]?.id);
model=next;selected='';pendingAction=null;await save();

t('Datos de prueba eliminados');
}catch(e){syncMessage='Reinicio no completado: '+e.message;t(syncMessage,'error');console.error(e);}
finally{syncBusy=false;render();}
}
function mergeCloud(local,cloud){
ensure(local);ensure(cloud);
const out={...local};let conflicts=[];
for(const key of SYNC_KEYS){
const own=(local[key]||[]).map(x=>({...x})),byId=new Map(own.map((x,i)=>[x.id,i]));
for(const obj of cloud[key]||[]){
if(!obj||!obj.id)throw Error('Registro remoto sin ID en '+key);
if(!byId.has(obj.id)){byId.set(obj.id,own.length);own.push(obj);}
else{
const stable=x=>JSON.stringify(x,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){return Object.keys(v).sort().reduce((o,key)=>(o[key]=v[key],o),{});}return v;});
if(stable(own[byId.get(obj.id)])!==stable(obj))conflicts.push(key+'/'+obj.id);
}
}
out[key]=own;
}
if(conflicts.length)throw Error('Versiones distintas del mismo registro: '+conflicts.slice(0,2).join(', ')+'. No se modificó ningún dato.');
if(out.customers.filter(c=>!clientArchived(c.id,out)).length>100)throw Error('La unión supera 100 clientes activos; no se modificó ningún dato.');
return out;
}
async function driveRequest(url,opts={}){
if(!driveIsConnected())throw Error('Vuelve a conectar Google Drive');
const res=await fetch(url,{...opts,headers:{Authorization:'Bearer '+driveAccessToken,...opts.headers}});
if(!res.ok)throw Error('Drive HTTP '+res.status+': '+(await res.text()).slice(0,140));
return res;
}
async function driveFiles(){
let all=[],token='';
do{
const q=new URLSearchParams({spaces:'appDataFolder',fields:'nextPageToken,files(id,name,version)',page_size:'100'});
if(token)q.set('pageToken',token);
const data=await (await driveRequest('https://www.googleapis.com/drive/v3/files?'+q)).json();
all.push(...(data.files||[]));token=data.nextPageToken||'';
}while(token);
return all.filter(x=>x.name===SYNC_NAME);
}
async function driveGet(id){const data=await(await driveRequest('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media')).json();ensure(data);return data;}
async function drivePut(name,data,fileId){
const body=JSON.stringify(data);
if(fileId){await driveRequest('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(fileId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});return;}
const boundary='agrostock_'+Math.random().toString(36).slice(2);
const meta=JSON.stringify({name,mimeType:'application/json',parents:['appDataFolder']});
const multi='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+boundary+'--';
await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body:multi});
}
async function syncNow(automatic=false){

let changedDeviceDuringSync=false;
syncBusy=true;syncMessage='Consultando registros en Drive…';if(!automatic)render();
try{
const files=await driveFiles();if(files.length>1)throw Error('Existen varias copias principales; hay que revisarlas antes de continuar.');
const remote=files.length?await driveGet(files[0].id):null;
const remoteEpoch=Number(remote?.syncEpoch)||0,localEpoch=Number(model.syncEpoch)||0;

let silentReconnectAttempted=false;
async function trySilentReconnect(){

try{
await loadGoogleIdentity();
google.accounts.oauth2.initTokenClient({
client_id:GOOGLE_OAUTH_CLIENT_ID,
scope:'https://www.googleapis.com/auth/drive.appdata',
callback:async result=>{
if(result.error||!result.access_token){driveStatus='Autorización requerida para continuar sincronizando';if(screen==='datos')render();return;}
driveAccessToken=result.access_token;driveTokenExpires=Date.now()+(Number(result.expires_in)||3600)*1000;
try{
const response=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&page_size=1',{headers:{Authorization:'Bearer '+driveAccessToken}});
if(!response.ok)throw Error('Drive HTTP '+response.status);
driveStatus='Conexión comprobada (sesión recuperada).';
if(screen==='datos')render();
syncAutoSchedule(1600);
}catch(e){driveAccessToken=null;driveStatus='Vuelve a conectar Drive: '+e.message;if(screen==='datos')render();}
}
}).requestAccessToken({prompt:''});
}catch(e){driveStatus='Conecta Drive para reanudar la sincronización';if(screen==='datos')render();}
}

function cust(id){return model.customers.find(x=>x.id===id)}
function prod(id){return model.products.find(x=>x.id===id)}

function baseUnit(unit){return unit==='kg'||unit==='g'?'g':unit==='L'||unit==='cm³'?'cm³':'ud.'}
function toBase(amount,unit){return num(amount)*(unit==='kg'||unit==='L'?1000:1)}
function fromBase(amount,unit){return amount/(unit==='kg'||unit==='L'?1000:1)}
function stockBase(cid,pid){return model.movements.filter(x=>x.customerId===cid&&x.productId===pid).reduce((sum,x)=>sum+x.delta,0)}
function stockView(cid,pid){const p=prod(pid);return p?fmt(fromBase(stockBase(cid,pid),p.unit))+' '+p.unit:'—'}
function signed(m){let p=prod(m.productId);if(!p)return '';let value=fromBase(m.delta,p.unit);return (value>0?'+':'')+fmt(value)+' '+p.unit}

function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function findByName(items,q){let x=norm(q);return items.find(a=>norm(a.name)===x)||items.filter(a=>norm(a.name).includes(x)||x.includes(norm(a.name))).sort((a,b)=>b.name.length-a.name.length)[0]}
function spokenNumbers(raw){
const d={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900,mil:1000};
const words=norm(raw).replace(/[.,;:!?]/g,' ').split(/\s+/);
let out=[],i=0;
while(i<words.length){
const w=words[i],veinti=w.match(/^veinti(?:un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve)$/);
if(!(w in d)&&!veinti){out.push(words[i++]);continue;}
let value=0,group=0,j=i,found=false;
while(j<words.length){
const x=words[j],v=d[x],v21=x.match(/^veinti(un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve)$/);
if(v21){group+=20+d[v21[1]];found=true;j++;continue;}
if(x==='y'&&j+1<words.length&&words[j+1] in d&&d[words[j+1]]<10){j++;continue;}
if(v===undefined)break;
found=true;
if(x==='mil'){value+=(group||1)*1000;group=0;}else if(v===100){group=(group||1)*100;}else if(v>=200){group+=v;}else{group+=v;}
j++;
}
if(found){out.push(String(value+group));i=j;}else{out.push(words[i++]);}
}
return out.join(' ');
}

let kind=/\b(revision|recuento|quedan|queda|hay en almacen)\b/.test(n)?'revision':/\b(tratamiento|tratar|aplico|aplicado|aplicar|aplicacion|abonado|abonar|fertilizacion|fertilizar|enmienda|consumio|gasto|descontar|instalo|instalado)\b/.test(n)?'tratamiento':/\b(anadir|agregar|compr|entrada|recib|sumar|incorporar)\b/.test(n)?'entrada':null;if(!kind)throw Error('No identifiqué la operación. Prueba «Añadir», «Tratamiento» o «Revisión».');
let customer=model.customers.filter(c=>!clientArchived(c.id)&&n.includes(norm(c.name))).sort((a,b)=>b.name.length-a.name.length)[0];if(!customer&&$('quickCustomer')?.value)customer=cust($('quickCustomer').value);if(!customer||clientArchived(customer.id))throw Error('No identifiqué un cliente activo. Selecciónalo en Productor o indica su nombre.');let product=model.products.filter(p=>n.includes(norm(p.name))).sort((a,b)=>b.name.length-a.name.length)[0];if(!product)throw Error('No identifiqué el producto. Debe estar creado en el catálogo y escrito con su nombre.');
let match=n.match(/(\d+(?:[.,]\d+)?)\s*(kg|kilos?|kilogramos?|g|gramos?|l|litros?|cm3|cc|centimetros cubicos|ud\.?|unidades?|difusores?)/i);
let packages=n.match(/(\d+(?:[.,]\d+)?)\s*(?:garrafas?|botellas?|envases?|cajas?|bolsas?|paquetes?)\s*(?:de|con)\s*(\d+(?:[.,]\d+)?)\s*(kg|kilos?|g|gramos?|l|litros?|cm3|cc|centimetros cubicos|ud\.?|unidades?|difusores?)/i);
if(packages)match=[null,String(num(packages[1])*num(packages[2])),packages[3]];
if(!match)throw Error('No encuentro la cantidad y unidad. Ejemplo: «6 kg» o «450 difusores».');let qty=num(match[1]),rawUnit=norm(match[2]);let unit=/^(kg|kilo)/.test(rawUnit)?'kg':/^(g|gramo)/.test(rawUnit)?'g':/^(l|litro)/.test(rawUnit)?'L':/^(cm3|cc|centimetro)/.test(rawUnit)?'cm³':'ud.';

function findPlanLine(lineId){if(!lineId)return null;for(let plan of model.plans||[])for(let line of plan.lines||[])if(line.id===lineId)return {plan,line};return null}
function planApplied(lineId){return model.movements.filter(m=>m.kind==='tratamiento'&&m.planLineId===lineId).reduce((s,m)=>s-Math.min(0,m.delta),0)}
function planLineOptions(cid,pid){return (model.plans||[]).filter(p=>p.customerId===cid).flatMap(p=>(p.lines||[]).filter(l=>!pid||l.productId===pid).map(l=>`<option value="${esc(l.id)}">${esc(p.name)} — ${esc(pName(l.productId))} · ${esc(l.plot||'Todas las parcelas')}</option>`)).join('')}
function planOverview(cid){let plans=model.plans.filter(p=>p.customerId===cid);if(!plans.length)return '<div class="empty">Este cliente todavía no tiene planes de abonado. Créalo desde la sección Abonado.</div>';return plans.map(p=>`<div style="margin-bottom:23px"><div class="planheadline"><h3>${esc(p.name)} · ${esc(p.campaign)}</h3><span class="pill">${esc(p.plot||'Sin parcela especificada')}</span></div><p class="muted">${esc(p.start||'Sin inicio')} — ${esc(p.end||'Sin fin')} · ${esc(p.notes||'')}</p>${p.lines.map(l=>{let product=prod(l.productId),planned=l.targetBase,done=planApplied(l.id),pct=planned>0?done/planned*100:0,unit=product?.unit||'kg';return `<div class="planline"><div class="planheadline"><b>${esc(pName(l.productId))}</b><span class="pill ${pct>=100?'':'warn'}">${fmt(pct)} %</span></div><div class="progress"><div style="width:${Math.max(0,Math.min(100,pct))}%"></div></div><div class="row small between" style="margin-top:7px"><span>Aplicado: <b>${fmt(fromBase(done,unit))} ${esc(unit)}</b></span><span>Previsto: ${fmt(fromBase(planned,unit))} ${esc(unit)}</span><span>${done>=planned?'Objetivo alcanzado':'Pendiente: '+fmt(fromBase(planned-done,unit))+' '+esc(unit)}</span></div><button class="btn alt" data-apply-line="${esc(l.id)}" style="margin-top:10px">+ Registrar aplicación</button></div>`}).join('')}</div>`).join('')}
function plansScreen(){let fertilizer=model.products.filter(p=>['fertilizante','enmienda'].includes(p.category));return `${head('Planes de abonado','Objetivos por cliente, campaña y producto. Las aplicaciones vinculadas descuentan stock y actualizan el avance.')}<div class="grid"><div class="half card"><h2>Nuevo plan</h2><form id="createPlan" class="stack">${select('Cliente *','customer',customerOptions(selected))}${input('Nombre del plan *','name','text','','required placeholder="Ej.: Abonado 2027"')}${input('Campaña *','campaign','text',String(new Date().getFullYear()),'required')}${input('Parcela / recinto','plot') }<div class="fields">${input('Desde','start','date','')}${input('Hasta','end','date','')}</div><div class="field"><label>Observaciones</label><textarea name="notes" placeholder="Objetivos generales del plan..."></textarea></div><button class="btn">Crear plan</button></form><div class="notice" style="margin-top:10px">El plan registra cantidades previstas de productos. No calcula automáticamente las necesidades nutricionales N, P₂O₅, K₂O ni sustituye una recomendación agronómica.</div></div><div class="half card"><h2>Añadir objetivo a un plan</h2>${model.plans.length?`<form id="addPlanLine" class="stack">${select('Plan *','plan',model.plans.map(p=>`<option value="${esc(p.id)}">${esc(cName(p.customerId))} — ${esc(p.name)} (${esc(p.campaign)})</option>`).join(''))}${select('Fertilizante o enmienda *','product',fertilizer.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.unit)})</option>`).join('')||'<option value="">Crea antes un fertilizante o enmienda</option>')}${input('Cantidad prevista *','target','number','','required min="0.000001" step="any"') }<div class="muted small">La cantidad se expresa en la unidad configurada para el producto.</div>${input('Parcela específica (opcional)','plot') }<button class="btn" ${fertilizer.length?'':'disabled'}>Añadir objetivo</button></form>`:'<p class="muted">Crea primero un plan para añadir sus productos previstos.</p>'}<div class="notice" style="margin-top:10px">Para contabilizar una aplicación en el plan, selecciónala en «Movimientos», con tipo «Tratamiento», y elige su línea de plan. No se cuenta dos veces.</div></div><div class="full card"><h2>Seguimiento de los planes</h2>${model.plans.length?model.customers.filter(c=>model.plans.some(p=>p.customerId===c.id)).map(c=>`<div style="margin-bottom:20px"><h3>${esc(c.name)}</h3>${planOverview(c.id)}</div>`).join(''):'<div class="empty">Todavía no hay planes de abonado.</div>'}</div></div>`}

// Seguimiento de visitas, pedidos y alertas: todos los datos permanecen locales.
function daysBetween(a,b){let x=Date.parse(a+'T12:00:00Z'),y=Date.parse(b+'T12:00:00Z');return Number.isFinite(x)&&Number.isFinite(y)?Math.round((y-x)/86400000):null}
function lastPhyto(customerId,plot){let key=norm(plot||'');return model.movements.filter(m=>m.customerId===customerId&&m.kind==='tratamiento'&&['fitosanitario','difusor'].includes(prod(m.productId)?.category)&&(!key||norm(m.plot||'')===key)&&m.date<=today()).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}
function alertState(a){let last=lastPhyto(a.customerId,a.plot),elapsed=last?daysBetween(last.date,today()):null;return {...a,last,elapsed,state:!a.enabled?'desactivada':!last?'sin aplicación':elapsed>=Number(a.days)?'vencida':'en plazo',remaining:last?Math.max(0,Number(a.days)-elapsed):null}}
function allAlertStates(cid=''){return model.alerts.filter(a=>!cid||a.customerId===cid).map(alertState).sort((a,b)=>Number(b.state==='vencida')-Number(a.state==='vencida'))}
function alertSummary(a){return `<div class="filetile" style="margin:8px 0"><div class="row between"><b>${esc(cName(a.customerId))} · ${esc(a.plot||'Todas las parcelas')}</b><span class="pill ${a.state==='vencida'?'red':a.state==='en plazo'?'':'warn'}">${esc(a.state)}</span></div><p class="small">Intervalo: <b>${Number(a.days)} días</b> · Última aplicación: <b>${esc(a.last?.date||'Sin registrar')}</b>${a.last?` · Transcurridos: ${a.elapsed} días · ${a.state==='en plazo'?'Restan '+a.remaining+' días':'Plazo alcanzado'}`:''}</p><div class="muted small">${esc(a.reason||'')}</div><div class="actions"><button class="btn alt" data-toggle-alert="${esc(a.id)}">${a.enabled?'Desactivar':'Activar'}</button><button class="btn danger" data-del-alert="${esc(a.id)}">Eliminar regla</button></div></div>`}
function alertsList(cid){let arr=allAlertStates(cid);return arr.length?arr.map(alertSummary).join(''):'<div class="empty">Sin reglas de seguimiento para este cliente.</div>'}
function alertsScreen(){let overdue=allAlertStates().filter(a=>a.state==='vencida');return `${head('Alertas por aplicación fitosanitaria','El técnico fija los días según climatología y estado sanitario de la parcela.')}<div class="grid"><div class="half card"><h2>Configurar seguimiento</h2><form id="createAlert" class="stack">${select('Productor *','customer',customerOptions(selected))}${input('Parcela / recinto (vacío = cualquiera)','plot','text','','placeholder="Ej.: Parcela Norte"')}${input('Días desde última aplicación *','days','number','10','required min="1" max="365" step="1"')}<div class="field"><label>Motivo y criterio técnico</label><textarea name="reason" placeholder="Estado sanitario, lluvia, previsión, evolución del mildiu..."></textarea></div><button class="btn">Guardar alerta</button></form><div class="notice" style="margin-top:12px">El plazo cuenta desde la última aplicación fitosanitaria registrada de esa parcela. Si dejas la parcela vacía, cuenta desde la última del productor. No calcula seguridad ni plazo legal de reentrada. La alerta es de seguimiento, no una recomendación automática de tratar.</div></div><div class="half card"><h2>Alertas vencidas (${overdue.length})</h2>${overdue.length?overdue.map(alertSummary).join(''):'<div class="empty">Sin alertas vencidas.</div>'}<div class="notice">Avisos visibles al abrir la aplicación. Sin servidor ni notificaciones push, no se enviarán avisos al teléfono cuando la aplicación esté cerrada.</div></div><div class="full card"><h2>Todas las alertas (${model.alerts.length})</h2>${alertsList()}</div></div>`}
async function submitAlert(e){e.preventDefault();let f=new FormData(e.target),customerId=f.get('customer'),days=Number(f.get('days')),plot=String(f.get('plot')||'').trim();if(!cust(customerId)||!Number.isInteger(days)||days<1||days>365)return t('Elige productor y un intervalo entre 1 y 365 días','error');let current=model.alerts.find(a=>a.customerId===customerId&&norm(a.plot)===norm(plot));if(current&&!confirm('Ya hay una alerta para este productor y parcela. ¿Actualizar sus días y criterio?'))return;let item={customerId,plot,days,reason:String(f.get('reason')||''),enabled:true,updated:stamp(),technician:model.tech};if(current)Object.assign(current,item);else model.alerts.push({id:id(),...item});await save();selected=customerId;render();t('Seguimiento guardado')}
